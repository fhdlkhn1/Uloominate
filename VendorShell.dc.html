<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
<script>
(function () {
  if (location.protocol !== 'file:') return;
  var here = decodeURIComponent(location.pathname.replace(/\/[^\/]*$/, ''));
  var win = /^\/[A-Za-z]:/.test(here);
  var dir = win ? here.slice(1).replace(/\//g, '\\') : here;
  document.addEventListener('DOMContentLoaded', function () {
    var o = document.createElement('div');
    o.setAttribute('data-file-protocol-guard', '');
    o.style.cssText = 'position:fixed;inset:0;z-index:2147483647;background:#F2FAF7;overflow:auto;font-family:Poppins,system-ui,sans-serif;color:#121212;padding:40px 24px';
    o.innerHTML =
      '<div style="max-width:680px;margin:0 auto;background:#fff;border:1px solid #E6EFEA;border-radius:16px;padding:32px;box-shadow:0 1px 2px rgba(18,18,18,.04),0 24px 48px -32px rgba(41,72,60,.4)">' +
      '<h1 style="margin:0 0 12px;font-weight:600;font-size:26px;line-height:1.2;color:#29483C">One step before this page works</h1>' +
      '<p style="margin:0 0 18px;font-size:15px;line-height:1.75;color:#444">You opened this file straight from disk. Browsers block a local file from loading its data and shared components, so the page renders its layout and then stops at <em>Loading…</em>. Nothing is broken \u2014 it just has to be served over <code>http://</code>.</p>' +
      '<div style="background:#EAF7F1;border-left:4px solid #3A836B;border-radius:10px;padding:16px 18px;margin:0 0 18px">' +
      '<p style="margin:0 0 10px;font-weight:600;font-size:14.5px;color:#29483C">Quickest fix \u2014 no server at all</p>' +
      '<p style="margin:0 0 13px;font-size:14px;line-height:1.7;color:#444">Open <code>standalone.html</code> in this same folder. It is the whole prototype in one self-contained file, so it runs straight from disk. Screens that take an id in the address \u2014 product detail, vendor storefront \u2014 need the served copy below.</p>' +
      '<a href="standalone.html" style="display:inline-flex;align-items:center;height:44px;padding:0 20px;border-radius:8px;background:#3A836B;color:#fff;font-weight:600;font-size:14px;text-decoration:none">Open standalone.html</a></div>' +
      '<div style="background:#F5F8F7;border-left:4px solid #DCE7E1;border-radius:10px;padding:16px 18px;margin:0 0 18px">' +
      '<p style="margin:0 0 10px;font-weight:600;font-size:14.5px;color:#29483C">Or serve the folder</p>' +
      '<p style="margin:0;font-size:14px;line-height:1.7;color:#444">In the prototype folder, <strong>right-click</strong> ' +
      (win ? '<code>start-windows.bat</code> and choose <strong>Run</strong>' : '<code>start-mac-linux.command</code> and choose <strong>Open</strong>, then confirm') +
      '. macOS blocks these on a plain double-click the first time \u2014 right-click and Open gets past it.</p></div>' +
      '<p style="margin:0 0 8px;font-weight:600;font-size:14.5px;color:#29483C">Or do it by hand</p>' +
      '<pre style="margin:0 0 18px;background:#122A22;color:#E8F2ED;border-radius:10px;padding:16px 18px;overflow-x:auto;font-size:13.5px;line-height:1.6;font-family:ui-monospace,monospace">cd "' + dir + '"\n' + (win ? 'python' : 'python3') + ' -m http.server 8000</pre>' +
      '<p style="margin:0 0 20px;font-size:14px;line-height:1.7;color:#444">Then open <a href="http://localhost:8000/Sitemap.dc.html" style="color:#3A836B;font-weight:600">http://localhost:8000/Sitemap.dc.html</a></p>' +
      '<a href="START-HERE.html" style="display:inline-flex;align-items:center;height:48px;padding:0 22px;border-radius:8px;background:#3A836B;color:#fff;font-weight:600;font-size:15px;text-decoration:none">Full instructions</a>' +
      '</div>';
    document.body.appendChild(o);
  });
})();
</script>
</head>
<body>
<x-dc>
<div data-region="vendor-shell" style="min-height:100vh;display:flex;background:#F7FAF9">

  <aside data-testid="vendor-sidebar" style="flex:0 0 268px;width:268px;background:#122A22;display:flex;flex-direction:column;gap:0;position:sticky;top:0;height:100vh;overflow-y:auto">
    <a href="{{ homeHref }}" style="display:flex;align-items:center;gap:10px;padding:22px 20px 20px;border-bottom:1px solid rgba(255,255,255,.09)">
      <img src="assets/img/logo-mark.png" alt="" width="30" height="36" style="object-fit:contain" />
      <span style="font-family:'Montserrat Alternates',Poppins,sans-serif;font-weight:500;font-size:21px;color:#FEDC97">Uloominate</span>
    </a>

    <div style="padding:18px 20px;border-bottom:1px solid rgba(255,255,255,.09);display:flex;align-items:center;gap:12px">
      <span style="flex:0 0 40px;width:40px;height:40px;border-radius:50%;overflow:hidden;background:#3A836B;color:#FFFFFF;display:grid;place-items:center;font-size:14px;font-weight:600">
        <sc-if value="{{ hasLogo }}" hint-placeholder-val="{{ false }}">
          <img src="{{ storeLogo }}" alt="" style="width:100%;height:100%;object-fit:cover" />
        </sc-if>
        <sc-if value="{{ noLogo }}" hint-placeholder-val="{{ true }}">
          <span>{{ storeInitials }}</span>
        </sc-if>
      </span>
      <span style="min-width:0;display:flex;flex-direction:column;gap:2px">
        <span style="font-weight:600;font-size:13px;color:#E8F2ED;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ storeName }}</span>
        <span style="font-size:11px;color:#8FBFAC">{{ planName }}</span>
      </span>
    </div>

    <nav aria-label="Vendor dashboard" style="flex:1;padding:14px 12px;display:flex;flex-direction:column;gap:2px">
      <sc-for list="{{ navGroups }}" as="g" hint-placeholder-count="3">
        <div style="display:flex;flex-direction:column;gap:2px;padding-bottom:14px">
          <span style="padding:8px 10px 4px;font-size:10px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:#6E8B80">{{ g.label }}</span>
          <sc-for list="{{ g.items }}" as="it" hint-placeholder-count="4">
            <a href="{{ it.href }}" aria-current="{{ it.current }}" style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;background:{{ it.bg }};font-weight:{{ it.weight }};font-size:13.5px;color:{{ it.ink }};transition:background .15s ease" style-hover="background:rgba(255,255,255,.09);color:#FFFFFF">
              <span aria-hidden="true" style="flex:0 0 7px;width:7px;height:7px;border-radius:50%;background:{{ it.dot }}"></span>
              <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ it.label }}</span>
              <sc-if value="{{ it.badge }}" hint-placeholder-val="{{ false }}">
                <span style="min-width:20px;height:19px;padding:0 6px;border-radius:10px;background:#FEDC97;color:#29483C;font-family:'DM Sans',Poppins,sans-serif;font-size:10.5px;font-weight:700;line-height:19px;text-align:center">{{ it.badge }}</span>
              </sc-if>
            </a>
          </sc-for>
        </div>
      </sc-for>
    </nav>

    <div style="padding:14px 20px 22px;border-top:1px solid rgba(255,255,255,.09);display:flex;flex-direction:column;gap:10px">
      <a href="{{ storefrontHref }}" style="font-size:12.5px;color:#9CC3B4" style-hover="color:#FEDC97">View my public store →</a>
      <button type="button" onClick="{{ onSignOut }}" style="padding:0;border:none;background:transparent;font-family:Poppins,sans-serif;font-size:12.5px;color:#9CC3B4;cursor:pointer;text-align:left" style-hover="color:#FEDC97">Sign out</button>
    </div>
  </aside>

  <div style="flex:1;min-width:0;display:flex;flex-direction:column">
    <header style="background:#FFFFFF;border-bottom:1px solid #E9EFEC;padding:18px clamp(20px,3vw,36px);display:flex;align-items:center;gap:20px;flex-wrap:wrap;position:sticky;top:0;z-index:20">
      <div style="flex:1 1 240px;min-width:0;display:flex;flex-direction:column;gap:3px">
        <h1 style="margin:0;font-weight:600;font-size:clamp(19px,1.7vw,24px);line-height:1.25;color:#29483C">{{ title }}</h1>
        <sc-if value="{{ hasSubtitle }}" hint-placeholder-val="{{ false }}">
          <p style="margin:0;font-size:13.5px;line-height:1.5;color:#595959">{{ subtitle }}</p>
        </sc-if>
      </div>
      <div style="flex:0 0 auto;display:flex;align-items:center;gap:12px">
        <sc-if value="{{ notApproved }}" hint-placeholder-val="{{ false }}">
          <a href="{{ pendingHref }}" style="display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:9999px;background:#FFF2DE;color:#B9913E;font-weight:600;font-size:12.5px" style-hover="background:#FBE9CF;color:#B9913E">
            <span aria-hidden="true" style="width:7px;height:7px;border-radius:50%;background:#B9913E"></span>
            {{ statusLabel }}
          </a>
        </sc-if>
        <a href="{{ newProductHref }}" style="display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 20px;border-radius:8px;background:#3A836B;color:#FFFFFF;font-weight:600;font-size:14px" style-hover="background:#29483C;color:#FFFFFF">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
          New resource
        </a>
      </div>
    </header>

    <main style="flex:1;padding:clamp(20px,2.4vw,32px);min-width:0">
      {{ children }}
    </main>
  </div>

  <dc-import name="DevToolbar" page="vendor" hint-size="0px,0px"></dc-import>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900},&quot;active&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;vendorDashboard&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Dashboard&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;subtitle&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const GROUPS = [
  ['Overview', [
    ['vendorDashboard', 'Dashboard'],
    ['vendorReports', 'Reports'],
  ]],
  ['Catalogue', [
    ['vendorProducts', 'My products'],
    ['vendorProductEdit', 'Add a resource'],
    ['vendorMedia', 'Media library'],
  ]],
  ['Selling', [
    ['vendorOrders', 'Orders'],
    ['vendorPayments', 'Payments'],
    ['vendorCoupons', 'Coupons'],
    ['vendorCustomers', 'Customers'],
    ['vendorMessages', 'Messages'],
  ]],
  ['Store', [
    ['vendorStoreProfile', 'Store profile'],
    ['vendorSubscription', 'Subscription'],
  ]],
];

class Component extends DCLogic {
  state = { user: null, badges: {} };

  async componentDidMount() {
    const [app, db] = await Promise.all([
      import('./assets/js/app.js'), import('./assets/js/db.js'),
    ]);
    await app.boot();
    this.app = app; this.db = db;
    const user = app.auth.currentUser();
    if (!user) return;
    const vid = user.vendorId || (user.vendor && user.vendor.id);
    this.setState({
      user,
      badges: {
        vendorProducts: vid ? db.findAll('products', { filter: { vendorId: vid, status: 'pending' } }).total : 0,
        vendorMessages: vid ? db.findAll('messages', { filter: { vendorId: vid, status: 'open' } }).total : 0,
      },
    });
  }

  renderVals() {
    const p = this.props || {};
    const url = this.app ? this.app.router.url : (() => '#');
    const user = (this.user || this.state.user);
    const v = user && user.vendor;
    const active = p.active || 'vendorDashboard';
    const badges = this.state.badges;

    return {
      children: p.children,
      title: p.title || '',
      subtitle: p.subtitle || '',
      hasSubtitle: !!p.subtitle,
      homeHref: url('landing'),
      newProductHref: url('vendorProductEdit'),
      pendingHref: url('vendorPending'),
      storefrontHref: v ? url('vendorStore', { store: v.slug }) : url('browse'),
      storeName: v ? v.storeName : (user ? user.name : 'Your store'),
      planName: v ? (v.planName || v.planCode) : '—',
      storeLogo: v ? v.logo : null,
      hasLogo: !!(v && v.logo),
      noLogo: !(v && v.logo),
      storeInitials: v ? (v.storeName || '?').split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase() : '?',
      notApproved: !!(v && v.status !== 'approved'),
      statusLabel: v ? ({ pending: 'Awaiting approval', declined: 'Registration declined', suspended: 'Store suspended' })[v.status] || v.status : '',
      navGroups: GROUPS.map(([label, items]) => ({
        label,
        items: items.map(([key, text]) => {
          const on = key === active;
          return {
            label: text,
            href: url(key),
            current: on ? 'page' : undefined,
            bg: on ? '#3A836B' : 'transparent',
            ink: on ? '#FFFFFF' : '#C6DAD1',
            weight: on ? 600 : 500,
            dot: on ? '#FEDC97' : 'rgba(255,255,255,.22)',
            badge: badges[key] ? String(badges[key]) : '',
          };
        }),
      })),
      onSignOut: async () => { await this.app.auth.logout(); this.app.router.go('landing'); },
    };
  }
}

</script>
</body>
</html>
