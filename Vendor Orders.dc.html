<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
<script>
(function () {
  if (location.protocol !== 'file:') return;
  var here = decodeURIComponent(location.pathname.replace(/\/[^\/]*$/, ''));
  var win = /^\/[A-Za-z]:/.test(here);
  var dir = win ? here.slice(1).replace(/\//g, '\\') : here;
  document.addEventListener('DOMContentLoaded', function () {
    var o = document.createElement('div');
    o.setAttribute('data-file-protocol-guard', '');
    o.style.cssText = 'position:fixed;inset:0;z-index:2147483647;background:#F2FAF7;overflow:auto;font-family:Poppins,system-ui,sans-serif;color:#121212;padding:40px 24px';
    o.innerHTML =
      '<div style="max-width:680px;margin:0 auto;background:#fff;border:1px solid #E6EFEA;border-radius:16px;padding:32px;box-shadow:0 1px 2px rgba(18,18,18,.04),0 24px 48px -32px rgba(41,72,60,.4)">' +
      '<h1 style="margin:0 0 12px;font-weight:600;font-size:26px;line-height:1.2;color:#29483C">One step before this page works</h1>' +
      '<p style="margin:0 0 18px;font-size:15px;line-height:1.75;color:#444">You opened this file straight from disk. Browsers block a local file from loading its data and shared components, so the page renders its layout and then stops at <em>Loading…</em>. Nothing is broken \u2014 it just has to be served over <code>http://</code>.</p>' +
      '<div style="background:#EAF7F1;border-left:4px solid #3A836B;border-radius:10px;padding:16px 18px;margin:0 0 18px">' +
      '<p style="margin:0 0 10px;font-weight:600;font-size:14.5px;color:#29483C">Quickest fix \u2014 no server at all</p>' +
      '<p style="margin:0 0 13px;font-size:14px;line-height:1.7;color:#444">Open <code>standalone.html</code> in this same folder. It is the whole prototype in one self-contained file, so it runs straight from disk. Screens that take an id in the address \u2014 product detail, vendor storefront \u2014 need the served copy below.</p>' +
      '<a href="standalone.html" style="display:inline-flex;align-items:center;height:44px;padding:0 20px;border-radius:8px;background:#3A836B;color:#fff;font-weight:600;font-size:14px;text-decoration:none">Open standalone.html</a></div>' +
      '<div style="background:#F5F8F7;border-left:4px solid #DCE7E1;border-radius:10px;padding:16px 18px;margin:0 0 18px">' +
      '<p style="margin:0 0 10px;font-weight:600;font-size:14.5px;color:#29483C">Or serve the folder</p>' +
      '<p style="margin:0;font-size:14px;line-height:1.7;color:#444">In the prototype folder, <strong>right-click</strong> ' +
      (win ? '<code>start-windows.bat</code> and choose <strong>Run</strong>' : '<code>start-mac-linux.command</code> and choose <strong>Open</strong>, then confirm') +
      '. macOS blocks these on a plain double-click the first time \u2014 right-click and Open gets past it.</p></div>' +
      '<p style="margin:0 0 8px;font-weight:600;font-size:14.5px;color:#29483C">Or do it by hand</p>' +
      '<pre style="margin:0 0 18px;background:#122A22;color:#E8F2ED;border-radius:10px;padding:16px 18px;overflow-x:auto;font-size:13.5px;line-height:1.6;font-family:ui-monospace,monospace">cd "' + dir + '"\n' + (win ? 'python' : 'python3') + ' -m http.server 8000</pre>' +
      '<p style="margin:0 0 20px;font-size:14px;line-height:1.7;color:#444">Then open <a href="http://localhost:8000/Sitemap.dc.html" style="color:#3A836B;font-weight:600">http://localhost:8000/Sitemap.dc.html</a></p>' +
      '<a href="START-HERE.html" style="display:inline-flex;align-items:center;height:48px;padding:0 22px;border-radius:8px;background:#3A836B;color:#fff;font-weight:600;font-size:15px;text-decoration:none">Full instructions</a>' +
      '</div>';
    document.body.appendChild(o);
  });
})();
</script>
</head>
<body>
<x-dc>
<helmet>
<title>Orders — Uloominate</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;family=Montserrat+Alternates:wght@500&amp;family=DM+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet" />
<style>
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;font-family:Poppins,system-ui,sans-serif;color:#121212;background:#F7FAF9;-webkit-font-smoothing:antialiased}
  a{color:#3A836B;text-decoration:none}a:hover{color:#29483C}
  :focus-visible{outline:2px solid #3A836B;outline-offset:3px;border-radius:6px}
</style>
</helmet>
<div data-screen-label="V-04 Vendor Orders">
  <dc-import name="VendorShell" active="vendorOrders" title="Orders" subtitle="{{ subtitle }}" hint-size="100%,100vh">

    <div style="display:flex;flex-direction:column;gap:18px">

      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
        <label style="display:flex;align-items:center;gap:8px;height:42px;padding:0 14px;border:1px solid #E9EFEC;border-radius:8px;background:#FFFFFF">
          <span style="font-size:12.5px;color:#595959">Status</span>
          <select value="{{ status }}" onChange="{{ onStatus }}" aria-label="Filter by status" style="border:none;background:transparent;font-family:Poppins,sans-serif;font-size:13.5px;font-weight:500;color:#121212;outline:none;cursor:pointer">
            <option value="">All</option>
            <option value="completed">Completed</option>
            <option value="refunded">Refunded</option>
            <option value="cancelled">Cancelled</option>
          </select>
        </label>
        <label style="margin-left:auto;display:flex;align-items:center;gap:8px;height:42px;padding:0 14px;border:1px solid #E9EFEC;border-radius:8px;background:#FFFFFF;flex:0 1 300px;min-width:190px">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#595959" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.4-3.4"></path></svg>
          <input type="search" value="{{ query }}" onInput="{{ onSearch }}" placeholder="Order reference or buyer" aria-label="Search orders" style="flex:1;min-width:0;border:none;outline:none;background:transparent;font-family:Poppins,sans-serif;font-size:13.5px" />
        </label>
      </div>

      <sc-if value="{{ loading }}" hint-placeholder-val="{{ true }}">
        <div aria-hidden="true" style="display:flex;flex-direction:column;gap:10px">
          <span style="height:76px;border-radius:12px;background:#EFF3F1"></span>
          <span style="height:76px;border-radius:12px;background:#F2F6F4"></span>
          <span style="height:76px;border-radius:12px;background:#F5F8F7"></span>
        </div>
      </sc-if>

      <sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ false }}">
        <div data-testid="orders-empty" style="background:#FFFFFF;border:1px dashed #DCE7E1;border-radius:16px;padding:60px 40px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center">
          <span style="width:70px;height:70px;border-radius:50%;background:#F2FAF7;display:grid;place-items:center">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#3A836B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h14l1 16H4Z"></path><path d="M9 8h6"></path></svg>
          </span>
          <h2 style="margin:0;font-weight:600;font-size:19px;color:#29483C">{{ emptyTitle }}</h2>
          <p style="margin:0;max-width:420px;font-size:13.5px;line-height:1.7;color:#595959">{{ emptyBody }}</p>
        </div>
      </sc-if>

      <sc-if value="{{ hasRows }}" hint-placeholder-val="{{ false }}">
        <div style="background:#FFFFFF;border:1px solid #E9EFEC;border-radius:16px;overflow:hidden">
          <sc-for list="{{ rows }}" as="o" hint-placeholder-count="6">
            <div data-testid="vendor-order-row" style="border-bottom:1px solid #F3F5F4">
              <button type="button" onClick="{{ o.onToggle }}" aria-expanded="{{ o.expanded }}" style="width:100%;display:flex;align-items:center;gap:16px;padding:16px 18px;border:none;background:{{ o.rowBg }};cursor:pointer;text-align:left;flex-wrap:wrap;font-family:Poppins,sans-serif">
                <span style="flex:0 0 auto;font-family:'DM Sans',Poppins,sans-serif;font-weight:700;font-size:13.5px;color:#3A836B;min-width:92px">{{ o.reference }}</span>
                <span style="flex:1 1 160px;min-width:0;display:flex;flex-direction:column;gap:2px">
                  <span style="font-weight:600;font-size:13.5px;color:#29483C;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ o.customer }}</span>
                  <span style="font-size:11.5px;color:#9AA5A0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ o.email }}</span>
                </span>
                <span style="flex:0 0 auto;font-size:12.5px;color:#595959;min-width:96px">{{ o.date }}</span>
                <span style="flex:0 0 auto;padding:4px 10px;border-radius:9999px;background:{{ o.badgeBg }};color:{{ o.badgeInk }};font-size:11.5px;font-weight:700">{{ o.statusLabel }}</span>
                <span style="flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:2px;min-width:92px">
                  <span style="font-family:'DM Sans',Poppins,sans-serif;font-weight:700;font-size:14.5px;color:#29483C">{{ o.earnings }}</span>
                  <span style="font-family:'DM Sans',Poppins,sans-serif;font-size:11px;color:#9AA5A0">{{ o.grossNote }}</span>
                </span>
                <span aria-hidden="true" style="flex:0 0 auto;color:#9AA5A0;line-height:0">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="transform:rotate({{ o.chevron }}deg);transition:transform .2s ease"><path d="m6 9 6 6 6-6"></path></svg>
                </span>
              </button>

              <sc-if value="{{ o.open }}" hint-placeholder-val="{{ false }}">
                <div style="padding:0 18px 18px;display:flex;flex-direction:column;gap:14px;background:#FCFDFC">
                  <div style="display:flex;flex-direction:column;gap:10px;padding-top:4px">
                    <sc-for list="{{ o.items }}" as="it" hint-placeholder-count="2">
                      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
                        <span style="flex:0 0 60px;width:60px;height:42px;border-radius:7px;overflow:hidden;background:#F3F4F6">
                          <img src="{{ it.cover }}" alt="" loading="lazy" style="display:block;width:100%;height:100%;object-fit:cover" />
                        </span>
                        <a href="{{ it.href }}" style="flex:1 1 200px;min-width:0;font-weight:500;font-size:13px;line-height:1.45;color:#121212" style-hover="color:#3A836B">{{ it.title }}</a>
                        <span style="flex:0 0 auto;display:flex;gap:14px;align-items:baseline">
                          <span style="font-family:'DM Sans',Poppins,sans-serif;font-size:12.5px;color:#595959">{{ it.price }}</span>
                          <span style="font-family:'DM Sans',Poppins,sans-serif;font-weight:700;font-size:13px;color:#3A836B">{{ it.earnings }}</span>
                        </span>
                      </div>
                    </sc-for>
                  </div>
                  <div style="display:flex;gap:20px;flex-wrap:wrap;padding-top:10px;border-top:1px solid #F1F4F2">
                    <sc-for list="{{ o.breakdown }}" as="b" hint-placeholder-count="4">
                      <span style="display:flex;flex-direction:column;gap:2px">
                        <span style="font-size:11.5px;color:#9AA5A0">{{ b.label }}</span>
                        <span style="font-family:'DM Sans',Poppins,sans-serif;font-weight:600;font-size:13.5px;color:{{ b.ink }}">{{ b.value }}</span>
                      </span>
                    </sc-for>
                    <span style="margin-left:auto;display:flex;flex-direction:column;gap:2px">
                      <span style="font-size:11.5px;color:#9AA5A0">Paid by</span>
                      <span style="font-size:13px;color:#29483C">{{ o.payment }}</span>
                    </span>
                  </div>
                </div>
              </sc-if>
            </div>
          </sc-for>
        </div>

        <sc-if value="{{ showPager }}" hint-placeholder-val="{{ false }}">
          <nav aria-label="Pagination" style="display:flex;justify-content:center;gap:8px">
            <button type="button" onClick="{{ onPrev }}" disabled="{{ prevDisabled }}" aria-label="Previous page" style="width:40px;height:40px;border:1px solid #E9EFEC;border-radius:8px;background:#FFFFFF;display:grid;place-items:center;cursor:pointer;opacity:{{ prevOpacity }};color:#2B2B2B" style-hover="border-color:#3A836B">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
            </button>
            <span style="display:inline-flex;align-items:center;padding:0 14px;font-family:'DM Sans',Poppins,sans-serif;font-size:13.5px;color:#595959">{{ pageLabel }}</span>
            <button type="button" onClick="{{ onNext }}" disabled="{{ nextDisabled }}" aria-label="Next page" style="width:40px;height:40px;border:1px solid #E9EFEC;border-radius:8px;background:#FFFFFF;display:grid;place-items:center;cursor:pointer;opacity:{{ nextOpacity }};color:#2B2B2B" style-hover="border-color:#3A836B">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
            </button>
          </nav>
        </sc-if>
      </sc-if>
    </div>

  </dc-import>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
const BADGES = {
  completed: { bg: '#EAF7F1', ink: '#3A836B', label: 'Completed' },
  refunded: { bg: '#F5EDFF', ink: '#7A5FA8', label: 'Refunded' },
  cancelled: { bg: '#F3F4F6', ink: '#595959', label: 'Cancelled' },
  failed: { bg: '#FDF1EF', ink: '#C0392B', label: 'Failed' },
  processing: { bg: '#FFF2DE', ink: '#B9913E', label: 'Processing' },
};

class Component extends DCLogic {
  state = { loading: true, rows: [], meta: null, user: null, status: '', query: '', page: 1, open: {}, plan: null };

  async componentDidMount() {
    const [app, orders, rules] = await Promise.all([
      import('./assets/js/app.js'),
      import('./assets/js/repositories/ordersRepo.js'),
      import('./assets/js/business-rules.js'),
    ]);
    await app.boot();
    Object.assign(this, { app, orders, rules });
    const user = app.auth.requireRole('vendor', 'admin');
    if (!user) return;
    this.vid = user.vendorId || (user.vendor && user.vendor.id) || 'v-1';
    const openId = app.router.param('id');
    this.setState({
      user,
      plan: rules.planByCode(user.vendor ? user.vendor.planCode : 'basic'),
      open: openId ? { [openId]: true } : {},
    });
    await this.load();
  }

  async load() {
    this.setState({ loading: true });
    const res = await this.orders.listOrders({
      vendorId: this.vid,
      status: this.state.status || undefined,
      q: this.state.query,
      page: this.state.page, pageSize: 12,
    });
    this.setState({ loading: false, rows: res.data, meta: res.meta });
  }

  money(n) { return '$' + Number(n || 0).toFixed(2); }

  renderVals() {
    const url = this.app ? this.app.router.url : (() => '#');
    const { loading, rows, meta, status, query, page, open, plan } = this.state;
    const pages = meta ? meta.totalPages : 1;
    const total = meta ? meta.total : 0;

    return {
      subtitle: total ? total + (total === 1 ? ' order' : ' orders') + ' containing your resources' : '',
      loading, status, query,
      isEmpty: !loading && rows.length === 0,
      hasRows: !loading && rows.length > 0,
      emptyTitle: query || status ? 'Nothing matches that view' : 'No orders yet',
      emptyBody: query || status
        ? 'Try clearing the search or choosing a different status.'
        : 'When a buyer purchases one of your resources the order appears here with your earnings.',

      rows: rows.map(o => {
        const b = BADGES[o.status] || BADGES.completed;
        const isOpen = !!open[o.id];
        const mine = o.vendorItems || [];
        const gross = o.vendorGross || 0;
        const earnings = o.vendorEarnings || 0;
        const commission = Math.round((gross - earnings) * 100) / 100;
        return {
          reference: o.reference,
          customer: o.customerName,
          email: o.customerEmail,
          date: new Date(o.placedAt).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }),
          statusLabel: b.label, badgeBg: b.bg, badgeInk: b.ink,
          earnings: this.money(earnings),
          grossNote: this.money(gross) + ' gross',
          payment: o.paymentMethod,
          open: isOpen,
          expanded: isOpen ? 'true' : 'false',
          chevron: isOpen ? 0 : -90,
          rowBg: isOpen ? '#FCFDFC' : '#FFFFFF',
          onToggle: () => this.setState(s => ({ open: Object.assign({}, s.open, { [o.id]: !s.open[o.id] }) })),
          items: mine.map(i => {
            const sp = plan ? this.rules.settleLine({ price: i.price, planCode: plan.code }) : null;
            return {
              title: i.title, cover: i.cover,
              href: url('product', { id: i.productId }),
              price: this.money(i.price),
              earnings: sp ? this.money(sp.vendorEarnings) : '—',
            };
          }),
          breakdown: [
            { label: 'Gross', value: this.money(gross), ink: '#29483C' },
            { label: 'Commission and fees', value: '−' + this.money(commission), ink: '#595959' },
            { label: 'Your earnings', value: this.money(earnings), ink: '#3A836B' },
            { label: 'Your items', value: mine.length + ' of ' + o.itemCount, ink: '#29483C' },
          ],
        };
      }),

      showPager: !loading && pages > 1,
      pageLabel: 'Page ' + page + ' of ' + pages,
      prevDisabled: page <= 1, nextDisabled: page >= pages,
      prevOpacity: page <= 1 ? 0.4 : 1, nextOpacity: page >= pages ? 0.4 : 1,
      onPrev: () => { if (page > 1) this.setState({ page: page - 1 }, () => this.load()); },
      onNext: () => { if (page < pages) this.setState({ page: page + 1 }, () => this.load()); },
      onStatus: e => this.setState({ status: e.target.value, page: 1 }, () => this.load()),
      onSearch: e => {
        const v = e.target.value;
        clearTimeout(this._t);
        this.setState({ query: v, page: 1 });
        this._t = setTimeout(() => this.load(), 220);
      },
    };
  }
}

</script>
</body>
</html>
