<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
<script>
(function () {
  if (location.protocol !== 'file:') return;
  var here = decodeURIComponent(location.pathname.replace(/\/[^\/]*$/, ''));
  var win = /^\/[A-Za-z]:/.test(here);
  var dir = win ? here.slice(1).replace(/\//g, '\\') : here;
  document.addEventListener('DOMContentLoaded', function () {
    var o = document.createElement('div');
    o.setAttribute('data-file-protocol-guard', '');
    o.style.cssText = 'position:fixed;inset:0;z-index:2147483647;background:#F2FAF7;overflow:auto;font-family:Poppins,system-ui,sans-serif;color:#121212;padding:40px 24px';
    o.innerHTML =
      '<div style="max-width:680px;margin:0 auto;background:#fff;border:1px solid #E6EFEA;border-radius:16px;padding:32px;box-shadow:0 1px 2px rgba(18,18,18,.04),0 24px 48px -32px rgba(41,72,60,.4)">' +
      '<h1 style="margin:0 0 12px;font-weight:600;font-size:26px;line-height:1.2;color:#29483C">One step before this page works</h1>' +
      '<p style="margin:0 0 18px;font-size:15px;line-height:1.75;color:#444">You opened this file straight from disk. Browsers block a local file from loading its data and shared components, so the page renders its layout and then stops at <em>Loading…</em>. Nothing is broken \u2014 it just has to be served over <code>http://</code>.</p>' +
      '<div style="background:#EAF7F1;border-left:4px solid #3A836B;border-radius:10px;padding:16px 18px;margin:0 0 18px">' +
      '<p style="margin:0 0 10px;font-weight:600;font-size:14.5px;color:#29483C">Quickest fix \u2014 no server at all</p>' +
      '<p style="margin:0 0 13px;font-size:14px;line-height:1.7;color:#444">Open <code>standalone.html</code> in this same folder. It is the whole prototype in one self-contained file, so it runs straight from disk. Screens that take an id in the address \u2014 product detail, vendor storefront \u2014 need the served copy below.</p>' +
      '<a href="standalone.html" style="display:inline-flex;align-items:center;height:44px;padding:0 20px;border-radius:8px;background:#3A836B;color:#fff;font-weight:600;font-size:14px;text-decoration:none">Open standalone.html</a></div>' +
      '<div style="background:#F5F8F7;border-left:4px solid #DCE7E1;border-radius:10px;padding:16px 18px;margin:0 0 18px">' +
      '<p style="margin:0 0 10px;font-weight:600;font-size:14.5px;color:#29483C">Or serve the folder</p>' +
      '<p style="margin:0;font-size:14px;line-height:1.7;color:#444">In the prototype folder, <strong>right-click</strong> ' +
      (win ? '<code>start-windows.bat</code> and choose <strong>Run</strong>' : '<code>start-mac-linux.command</code> and choose <strong>Open</strong>, then confirm') +
      '. macOS blocks these on a plain double-click the first time \u2014 right-click and Open gets past it.</p></div>' +
      '<p style="margin:0 0 8px;font-weight:600;font-size:14.5px;color:#29483C">Or do it by hand</p>' +
      '<pre style="margin:0 0 18px;background:#122A22;color:#E8F2ED;border-radius:10px;padding:16px 18px;overflow-x:auto;font-size:13.5px;line-height:1.6;font-family:ui-monospace,monospace">cd "' + dir + '"\n' + (win ? 'python' : 'python3') + ' -m http.server 8000</pre>' +
      '<p style="margin:0 0 20px;font-size:14px;line-height:1.7;color:#444">Then open <a href="http://localhost:8000/Sitemap.dc.html" style="color:#3A836B;font-weight:600">http://localhost:8000/Sitemap.dc.html</a></p>' +
      '<a href="START-HERE.html" style="display:inline-flex;align-items:center;height:48px;padding:0 22px;border-radius:8px;background:#3A836B;color:#fff;font-weight:600;font-size:15px;text-decoration:none">Full instructions</a>' +
      '</div>';
    document.body.appendChild(o);
  });
})();
</script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;family=Montserrat+Alternates:wght@500;600&amp;family=Playfair+Display:wght@400;500&amp;family=DM+Sans:wght@400;500;700&amp;family=Libre+Baskerville:wght@400;700&amp;family=Roboto:wght@400;500&amp;display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; font-family: Poppins, system-ui, -apple-system, sans-serif; color: #121212; background: #FFFFFF; -webkit-font-smoothing: antialiased; }
  a { color: #3A836B; text-decoration: none; }
  a:hover { color: #29483C; }
  button { font-family: inherit; }
  :focus-visible { outline: 2px solid #3A836B; outline-offset: 2px; border-radius: 4px; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; } }
</style>
</helmet>
<header data-region="site-header" style="background:#3A836B;width:100%;position:relative;z-index:40">
  <div style="max-width:1728px;margin:0 auto;padding:21px 66px 0 0;display:flex;flex-direction:column;gap:22px">

    <div style="display:flex;align-items:center;gap:24px;min-height:48px;flex-wrap:wrap;padding-left:clamp(16px,19.44vw,336px)">
      <a href="{{ homeHref }}" data-testid="brand-lockup" style="display:flex;align-items:center;gap:8px;flex:0 0 auto;text-decoration:none">
        <img src="assets/img/logo-mark.png" alt="" width="38" height="46" style="display:block;width:38px;height:46.28px;object-fit:contain" />
        <span style="font-family:'Montserrat Alternates',Poppins,sans-serif;font-weight:500;font-size:30px;line-height:37px;color:#FEDC97;white-space:nowrap">Uloominate</span>
      </a>

      <form data-testid="header-search" onSubmit="{{ onSearch }}" role="search" style="flex:1 1 320px;max-width:434px;min-width:220px;display:flex;align-items:center;gap:4px;height:48px;background:#FFFFFF;border-radius:28px;padding:0 8px 0 18px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#49454F" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex:0 0 auto"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.2-3.2"></path></svg>
        <input name="q" type="search" defaultValue="{{ searchQuery }}" placeholder="Search resources, subjects, vendors" aria-label="Search resources" style="flex:1;min-width:0;border:none;outline:none;background:transparent;font-family:Poppins,sans-serif;font-size:15px;color:#121212;padding:0 4px" />
        <button type="submit" aria-label="Search" style="flex:0 0 auto;width:36px;height:36px;border:none;border-radius:50%;background:#EAF7F1;color:#3A836B;display:grid;place-items:center;cursor:pointer;transition:background .18s ease" style-hover="background:#CFE9DE">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h13"></path><path d="m12 6 6 6-6 6"></path></svg>
        </button>
      </form>

      <div style="display:flex;align-items:center;justify-content:flex-end;gap:12px;margin-left:auto;flex:0 1 auto;min-width:0;flex-wrap:wrap;row-gap:10px">
        <sc-if value="{{ isGuest }}" hint-placeholder-val="{{ true }}">
          <a href="{{ registerHref }}" data-testid="header-register" style="display:inline-flex;align-items:center;gap:8px;height:40px;padding:10px 16px;border-radius:8px;background:#FEDC97;color:#29483C;font-weight:600;font-size:18px;line-height:20px;white-space:nowrap;transition:transform .18s ease,box-shadow .18s ease" style-hover="transform:translateY(-1px);box-shadow:0 6px 16px -6px rgba(18,18,18,.45);color:#29483C">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M19 8v6M22 11h-6"></path></svg>
            Register
          </a>
          <a href="{{ loginHref }}" data-testid="header-login" style="display:inline-flex;align-items:center;gap:8px;height:40px;padding:10px 16px;border-radius:8px;background:#FEDC97;color:#29483C;font-weight:600;font-size:18px;line-height:20px;white-space:nowrap;transition:transform .18s ease,box-shadow .18s ease" style-hover="transform:translateY(-1px);box-shadow:0 6px 16px -6px rgba(18,18,18,.45);color:#29483C">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><path d="m10 17 5-5-5-5"></path><path d="M15 12H3"></path></svg>
            Login
          </a>
        </sc-if>

        <a href="{{ cartHref }}" data-testid="header-cart" aria-label="{{ cartLabel }}" style="position:relative;display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;color:#FFFFFF;transition:background .18s ease" style-hover="background:rgba(255,255,255,.14);color:#FFFFFF">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="20" r="1.4"></circle><circle cx="18" cy="20" r="1.4"></circle><path d="M2 3h2.2l2.3 12.1a2 2 0 0 0 2 1.6h8.3a2 2 0 0 0 2-1.55L21 8H5.5"></path></svg>
          <sc-if value="{{ hasCartItems }}" hint-placeholder-val="{{ false }}">
            <span data-testid="cart-count" style="position:absolute;top:2px;right:1px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:#FEDC97;color:#29483C;font-size:11px;font-weight:700;line-height:19px;text-align:center">{{ cartCount }}</span>
          </sc-if>
        </a>

        <sc-if value="{{ isGuest }}" hint-placeholder-val="{{ true }}">
          <a href="{{ vendorLoginHref }}" data-testid="header-vendor-login" style="display:inline-flex;align-items:center;gap:8px;height:54px;padding:10px 22px;border-radius:100px;background:#FEDC97;color:#3A836B;font-weight:600;font-size:18px;line-height:20px;white-space:nowrap;transition:transform .18s ease,box-shadow .18s ease" style-hover="transform:translateY(-1px);box-shadow:0 8px 20px -8px rgba(18,18,18,.5);color:#3A836B">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9h18l-1.4 9.2a2 2 0 0 1-2 1.8H6.4a2 2 0 0 1-2-1.8Z"></path><path d="M8 9V6.5A3.5 3.5 0 0 1 11.5 3h1A3.5 3.5 0 0 1 16 6.5V9"></path></svg>
            Vendor Login
          </a>
        </sc-if>

        <sc-if value="{{ isSignedIn }}" hint-placeholder-val="{{ false }}">
          <div style="position:relative">
            <button type="button" data-testid="account-menu-trigger" aria-haspopup="menu" aria-expanded="{{ menuOpen }}" onClick="{{ toggleMenu }}" style="display:inline-flex;align-items:center;gap:10px;height:48px;padding:6px 16px 6px 6px;border:none;border-radius:100px;background:#FEDC97;color:#29483C;font-weight:600;font-size:16px;cursor:pointer;transition:transform .18s ease" style-hover="transform:translateY(-1px)">
              <span style="width:36px;height:36px;border-radius:50%;background:#3A836B;color:#FFFFFF;display:grid;place-items:center;font-size:14px;font-weight:600">{{ userInitials }}</span>
              <span style="white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis">{{ userFirstName }}</span>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
            </button>
            <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
              <div role="menu" data-testid="account-menu" style="position:absolute;top:calc(100% + 10px);right:0;min-width:250px;background:#FFFFFF;border:1px solid #E6EFEA;border-radius:14px;padding:8px;box-shadow:0 1px 2px rgba(18,18,18,.05),0 18px 40px -14px rgba(41,72,60,.32);display:flex;flex-direction:column;gap:2px;z-index:60">
                <div style="padding:10px 12px 12px;border-bottom:1px solid #F0F5F2;margin-bottom:6px">
                  <div style="font-size:14px;font-weight:600;color:#29483C;line-height:1.35">{{ userName }}</div>
                  <div style="font-size:12px;color:#595959;line-height:1.4;margin-top:2px">{{ roleLabel }}</div>
                </div>
                <sc-for list="{{ menuItems }}" as="item" hint-placeholder-count="4">
                  <a role="menuitem" href="{{ item.href }}" style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border-radius:9px;font-size:14px;font-weight:500;color:#29483C;transition:background .15s ease" style-hover="background:#F2FAF7;color:#29483C">
                    {{ item.label }}
                    <sc-if value="{{ item.badge }}" hint-placeholder-val="{{ false }}">
                      <span style="min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:#3A836B;color:#fff;font-size:11px;font-weight:700;line-height:20px;text-align:center">{{ item.badge }}</span>
                    </sc-if>
                  </a>
                </sc-for>
                <button type="button" role="menuitem" onClick="{{ onSignOut }}" style="margin-top:6px;padding:10px 12px;border:none;border-top:1px solid #F0F5F2;border-radius:0 0 9px 9px;background:transparent;text-align:left;font-family:Poppins,sans-serif;font-size:14px;font-weight:600;color:#C0392B;cursor:pointer;transition:background .15s ease" style-hover="background:#FDF1EF">Sign out</button>
              </div>
            </sc-if>
          </div>
        </sc-if>
      </div>
    </div>

    <nav data-testid="category-nav" aria-label="Resource categories" style="display:flex;align-items:center;gap:clamp(22px,3.1vw,54px);flex-wrap:wrap;padding-bottom:11px;padding-left:clamp(16px,14.87vw,257px);overflow-x:auto;scrollbar-width:none">
      <sc-for list="{{ navItems }}" as="item" hint-placeholder-count="10">
        <a href="{{ item.href }}" aria-current="{{ item.current }}" style="font-weight:{{ item.weight }};font-size:18px;line-height:27px;color:#FFFFFF;white-space:nowrap;padding-bottom:3px;border-bottom:2px solid {{ item.underline }};transition:border-color .18s ease,opacity .18s ease" style-hover="opacity:.82;color:#FFFFFF">{{ item.name }}</a>
      </sc-for>
    </nav>
  </div>
</header>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1728,&quot;height&quot;:140},&quot;active&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;searchQuery&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;launchMode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;pre-launch&quot;,&quot;post-launch&quot;],&quot;default&quot;:&quot;pre-launch&quot;,&quot;tsType&quot;:&quot;'pre-launch' | 'post-launch'&quot;}}">
class Component extends DCLogic {
  state = { ready: false, user: null, cartCount: 0, menuOpen: false, cats: [] };

  async componentDidMount() {
    const [app, rules, cart, platform] = await Promise.all([
      import('./assets/js/app.js'),
      import('./assets/js/business-rules.js'),
      import('./assets/js/repositories/cartRepo.js'),
      import('./assets/js/repositories/platformRepo.js'),
    ]);
    await app.boot();
    this.app = app; this.cartRepo = cart; this.platform = platform;
    this.sync(rules.CATEGORIES);
    this.offSession = app.auth.onSessionChange(() => this.sync(rules.CATEGORIES));
    this.offDb = app.db.onChange(() => this.sync(rules.CATEGORIES));
    this.onDocClick = e => {
      if (this.state.menuOpen && !e.target.closest('[data-testid="account-menu"],[data-testid="account-menu-trigger"]')) {
        this.setState({ menuOpen: false });
      }
    };
    this.onEsc = e => { if (e.key === 'Escape' && this.state.menuOpen) this.setState({ menuOpen: false }); };
    document.addEventListener('click', this.onDocClick);
    document.addEventListener('keydown', this.onEsc);
  }

  componentWillUnmount() {
    if (this.offSession) this.offSession();
    if (this.offDb) this.offDb();
    document.removeEventListener('click', this.onDocClick);
    document.removeEventListener('keydown', this.onEsc);
  }

  sync(cats) {
    const user = this.app.auth.currentUser();
    const owner = this.cartRepo.cartOwner(user);
    this.setState({ ready: true, user, cats, cartCount: this.cartRepo.cartCount(owner) });
  }

  menuFor(user) {
    // State can survive a remount that clears instance fields, so never assume
    // this.app is present just because a user is.
    if (!user || !this.app) return [];
    const { url } = this.app.router;
    if (user.role === 'admin') {
      const q = this.platform ? this.platform.queueCountsSync() : { vendors: 0, products: 0, payouts: 0 };
      return [
        { label: 'Admin dashboard', href: url('adminDashboard'), badge: 0 },
        { label: 'Vendor queue', href: url('adminVendorQueue'), badge: q.vendors },
        { label: 'Product queue', href: url('adminProductQueue'), badge: q.products },
        { label: 'Payouts', href: url('adminPayouts'), badge: q.payouts },
        { label: 'Reports', href: url('adminReports'), badge: 0 },
      ];
    }
    if (user.role === 'vendor') {
      const pending = user.vendor && user.vendor.status !== 'approved';
      return [
        { label: pending ? 'Approval status' : 'Vendor dashboard', href: url(pending ? 'vendorPending' : 'vendorDashboard'), badge: 0 },
        { label: 'My products', href: url('vendorProducts'), badge: 0 },
        { label: 'Orders', href: url('vendorOrders'), badge: 0 },
        { label: 'Payments', href: url('vendorPayments'), badge: 0 },
        { label: 'Subscription', href: url('vendorSubscription'), badge: 0 },
        { label: 'My downloads', href: url('accountDownloads'), badge: 0 },
      ];
    }
    return [
      { label: 'My orders', href: url('accountOrders'), badge: 0 },
      { label: 'Downloads', href: url('accountDownloads'), badge: 0 },
      { label: 'Wishlist', href: url('accountWishlist'), badge: 0 },
      { label: 'Following', href: url('accountFollowing'), badge: 0 },
      { label: 'Profile', href: url('accountProfile'), badge: 0 },
    ];
  }

  renderVals() {
    const p = this.props || {};
    const { user, cats, cartCount, menuOpen, ready } = this.state;
    const url = this.app ? this.app.router.url : (r => r);
    const active = p.active || '';

    const navItems = (cats.length ? cats : []).map(c => ({
      name: c.name,
      href: url('browse', { category: c.slug }),
      current: active === c.slug ? 'page' : undefined,
      weight: active === c.slug ? 600 : 500,
      underline: active === c.slug ? '#FEDC97' : 'transparent',
    })).concat(cats.length ? [{
      name: 'About Us', href: url('about'),
      current: active === 'about' ? 'page' : undefined,
      weight: active === 'about' ? 600 : 500,
      underline: active === 'about' ? '#FEDC97' : 'transparent',
    }] : []);

    return {
      ready,
      navItems,
      isGuest: ready && !user,
      isSignedIn: !!user,
      userName: user ? user.name : '',
      userFirstName: user ? user.firstName : '',
      userInitials: user ? (user.firstName[0] + (user.lastName ? user.lastName[0] : '')).toUpperCase() : '',
      roleLabel: user ? ({ admin: 'Administrator', vendor: user.vendor ? user.vendor.storeName : 'Vendor', customer: user.roleLabel || 'Educator' })[user.role] : '',
      menuItems: this.menuFor(user),
      menuOpen,
      cartCount,
      hasCartItems: cartCount > 0,
      cartLabel: cartCount ? `Cart, ${cartCount} item${cartCount === 1 ? '' : 's'}` : 'Cart, empty',
      searchQuery: p.searchQuery || '',
      homeHref: url(p.launchMode === 'post-launch' ? 'home' : 'landing'),
      loginHref: url('login'),
      registerHref: url('registerCustomer'),
      vendorLoginHref: url('registerVendor'),
      cartHref: url('cart'),
      toggleMenu: e => { e.stopPropagation(); this.setState(s => ({ menuOpen: !s.menuOpen })); },
      onSignOut: async () => { await this.app.auth.logout(); this.app.router.go('landing'); },
      onSearch: e => {
        e.preventDefault();
        const q = new FormData(e.target).get('q');
        this.app.router.go('browse', q ? { q } : {});
      },
    };
  }
}

</script>
</body>
</html>
