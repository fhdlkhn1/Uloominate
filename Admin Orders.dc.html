<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
<script>
(function () {
  if (location.protocol !== 'file:') return;
  var here = decodeURIComponent(location.pathname.replace(/\/[^\/]*$/, ''));
  var win = /^\/[A-Za-z]:/.test(here);
  var dir = win ? here.slice(1).replace(/\//g, '\\') : here;
  document.addEventListener('DOMContentLoaded', function () {
    var o = document.createElement('div');
    o.setAttribute('data-file-protocol-guard', '');
    o.style.cssText = 'position:fixed;inset:0;z-index:2147483647;background:#F2FAF7;overflow:auto;font-family:Poppins,system-ui,sans-serif;color:#121212;padding:40px 24px';
    o.innerHTML =
      '<div style="max-width:680px;margin:0 auto;background:#fff;border:1px solid #E6EFEA;border-radius:16px;padding:32px;box-shadow:0 1px 2px rgba(18,18,18,.04),0 24px 48px -32px rgba(41,72,60,.4)">' +
      '<h1 style="margin:0 0 12px;font-weight:600;font-size:26px;line-height:1.2;color:#29483C">One step before this page works</h1>' +
      '<p style="margin:0 0 18px;font-size:15px;line-height:1.75;color:#444">You opened this file straight from disk. Browsers block a local file from loading its data and shared components, so the page renders its layout and then stops at <em>Loading…</em>. Nothing is broken \u2014 it just has to be served over <code>http://</code>.</p>' +
      '<div style="background:#EAF7F1;border-left:4px solid #3A836B;border-radius:10px;padding:16px 18px;margin:0 0 18px">' +
      '<p style="margin:0 0 10px;font-weight:600;font-size:14.5px;color:#29483C">Quickest fix \u2014 no server at all</p>' +
      '<p style="margin:0 0 13px;font-size:14px;line-height:1.7;color:#444">Open <code>standalone.html</code> in this same folder. It is the whole prototype in one self-contained file, so it runs straight from disk. Screens that take an id in the address \u2014 product detail, vendor storefront \u2014 need the served copy below.</p>' +
      '<a href="standalone.html" style="display:inline-flex;align-items:center;height:44px;padding:0 20px;border-radius:8px;background:#3A836B;color:#fff;font-weight:600;font-size:14px;text-decoration:none">Open standalone.html</a></div>' +
      '<div style="background:#F5F8F7;border-left:4px solid #DCE7E1;border-radius:10px;padding:16px 18px;margin:0 0 18px">' +
      '<p style="margin:0 0 10px;font-weight:600;font-size:14.5px;color:#29483C">Or serve the folder</p>' +
      '<p style="margin:0;font-size:14px;line-height:1.7;color:#444">In the prototype folder, <strong>right-click</strong> ' +
      (win ? '<code>start-windows.bat</code> and choose <strong>Run</strong>' : '<code>start-mac-linux.command</code> and choose <strong>Open</strong>, then confirm') +
      '. macOS blocks these on a plain double-click the first time \u2014 right-click and Open gets past it.</p></div>' +
      '<p style="margin:0 0 8px;font-weight:600;font-size:14.5px;color:#29483C">Or do it by hand</p>' +
      '<pre style="margin:0 0 18px;background:#122A22;color:#E8F2ED;border-radius:10px;padding:16px 18px;overflow-x:auto;font-size:13.5px;line-height:1.6;font-family:ui-monospace,monospace">cd "' + dir + '"\n' + (win ? 'python' : 'python3') + ' -m http.server 8000</pre>' +
      '<p style="margin:0 0 20px;font-size:14px;line-height:1.7;color:#444">Then open <a href="http://localhost:8000/Sitemap.dc.html" style="color:#3A836B;font-weight:600">http://localhost:8000/Sitemap.dc.html</a></p>' +
      '<a href="START-HERE.html" style="display:inline-flex;align-items:center;height:48px;padding:0 22px;border-radius:8px;background:#3A836B;color:#fff;font-weight:600;font-size:15px;text-decoration:none">Full instructions</a>' +
      '</div>';
    document.body.appendChild(o);
  });
})();
</script>
</head>
<body>
<x-dc>
<helmet>
<title>Orders — Uloominate admin</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;family=Montserrat+Alternates:wght@500&amp;family=DM+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet" />
<style>
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;font-family:Poppins,system-ui,sans-serif;color:#121212;background:#F7F8FA;-webkit-font-smoothing:antialiased}
  a{color:#3A836B;text-decoration:none}a:hover{color:#29483C}
  :focus-visible{outline:2px solid #3A836B;outline-offset:3px;border-radius:6px}
</style>
</helmet>
<div data-screen-label="D-06 Admin Orders">
  <dc-import name="AdminShell" active="adminOrders" title="Orders" subtitle="{{ subtitle }}" hint-size="100%,100vh">

    <div style="display:flex;flex-direction:column;gap:18px">

      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="4">
          <button type="button" onClick="{{ t.onPick }}" aria-pressed="{{ t.pressed }}" style="display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 15px;border:1px solid {{ t.border }};border-radius:9999px;background:{{ t.bg }};font-family:Poppins,sans-serif;font-size:13px;font-weight:600;color:{{ t.ink }};cursor:pointer">
            {{ t.label }}
            <span style="min-width:20px;height:19px;padding:0 5px;border-radius:10px;background:{{ t.pillBg }};color:{{ t.pillInk }};font-family:'DM Sans',Poppins,sans-serif;font-size:11px;line-height:19px;text-align:center">{{ t.count }}</span>
          </button>
        </sc-for>
        <label style="margin-left:auto;display:flex;align-items:center;gap:8px;height:42px;padding:0 14px;border:1px solid #E7E9EE;border-radius:8px;background:#FFFFFF;flex:0 1 300px;min-width:190px">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#595959" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.4-3.4"></path></svg>
          <input type="search" value="{{ query }}" onInput="{{ onSearch }}" placeholder="Reference, buyer or email" aria-label="Search orders" style="flex:1;min-width:0;border:none;outline:none;background:transparent;font-family:Poppins,sans-serif;font-size:13.5px" />
        </label>
      </div>

      <sc-if value="{{ loading }}" hint-placeholder-val="{{ true }}">
        <div aria-hidden="true" style="display:flex;flex-direction:column;gap:10px">
          <span style="height:72px;border-radius:12px;background:#EEF0F4"></span>
          <span style="height:72px;border-radius:12px;background:#F1F3F6"></span>
          <span style="height:72px;border-radius:12px;background:#F3F5F8"></span>
        </div>
      </sc-if>

      <sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ false }}">
        <div data-testid="orders-empty" style="background:#FFFFFF;border:1px dashed #DCE7E1;border-radius:16px;padding:60px 40px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center">
          <h2 style="margin:0;font-weight:600;font-size:19px;color:#29483C">{{ emptyTitle }}</h2>
          <p style="margin:0;max-width:420px;font-size:13.5px;line-height:1.7;color:#595959">{{ emptyBody }}</p>
        </div>
      </sc-if>

      <sc-if value="{{ hasRows }}" hint-placeholder-val="{{ false }}">
        <div style="background:#FFFFFF;border:1px solid #E7E9EE;border-radius:16px;overflow:hidden">
          <sc-for list="{{ rows }}" as="o" hint-placeholder-count="8">
            <div data-testid="admin-order-row" style="border-bottom:1px solid #F3F5F7">
              <button type="button" onClick="{{ o.onToggle }}" aria-expanded="{{ o.expanded }}" style="width:100%;display:flex;align-items:center;gap:14px;padding:15px 18px;border:none;background:{{ o.rowBg }};cursor:pointer;text-align:left;flex-wrap:wrap;font-family:Poppins,sans-serif">
                <span style="flex:0 0 auto;font-family:'DM Sans',Poppins,sans-serif;font-weight:700;font-size:13px;color:#3A836B;min-width:88px">{{ o.reference }}</span>
                <span style="flex:1 1 170px;min-width:0;display:flex;flex-direction:column;gap:2px">
                  <span style="font-weight:600;font-size:13.5px;color:#29483C;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ o.customer }}</span>
                  <span style="font-size:11.5px;color:#9AA5A0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ o.email }}</span>
                </span>
                <span style="flex:0 0 auto;font-size:12.5px;color:#595959;min-width:94px">{{ o.date }}</span>
                <span style="flex:1 1 130px;min-width:0;font-size:12px;color:#595959;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ o.vendorLine }}</span>
                <span style="flex:0 0 auto;padding:4px 10px;border-radius:9999px;background:{{ o.badgeBg }};color:{{ o.badgeInk }};font-size:11.5px;font-weight:700">{{ o.statusLabel }}</span>
                <span style="flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:2px;min-width:88px">
                  <span style="font-family:'DM Sans',Poppins,sans-serif;font-weight:700;font-size:14.5px;color:#29483C">{{ o.total }}</span>
                  <span style="font-family:'DM Sans',Poppins,sans-serif;font-size:11px;color:#B9913E">{{ o.commission }}</span>
                </span>
                <span aria-hidden="true" style="flex:0 0 auto;color:#9AA5A0;line-height:0">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="transform:rotate({{ o.chevron }}deg);transition:transform .2s ease"><path d="m6 9 6 6 6-6"></path></svg>
                </span>
              </button>

              <sc-if value="{{ o.open }}" hint-placeholder-val="{{ false }}">
                <div style="padding:0 18px 18px;background:#FBFCFD;display:flex;flex-direction:column;gap:14px">
                  <div style="display:flex;flex-direction:column;gap:10px;padding-top:14px">
                    <sc-for list="{{ o.items }}" as="it" hint-placeholder-count="2">
                      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
                        <span style="flex:0 0 56px;width:56px;height:38px;border-radius:7px;overflow:hidden;background:#F3F4F6">
                          <img src="{{ it.cover }}" alt="" loading="lazy" style="display:block;width:100%;height:100%;object-fit:cover" />
                        </span>
                        <a href="{{ it.href }}" style="flex:1 1 200px;min-width:0;font-weight:500;font-size:13px;line-height:1.45;color:#121212" style-hover="color:#3A836B">{{ it.title }}</a>
                        <span style="flex:0 0 auto;font-size:12px;color:#595959;min-width:120px">{{ it.vendorName }}</span>
                        <span style="flex:0 0 auto;display:flex;gap:14px;align-items:baseline">
                          <span style="font-family:'DM Sans',Poppins,sans-serif;font-size:12.5px;color:#595959">{{ it.price }}</span>
                          <span style="font-family:'DM Sans',Poppins,sans-serif;font-size:12px;color:#3A836B">{{ it.vendorEarnings }}</span>
                          <span style="font-family:'DM Sans',Poppins,sans-serif;font-size:12px;color:#B9913E">{{ it.commission }}</span>
                        </span>
                      </div>
                    </sc-for>
                  </div>

                  <div style="display:flex;gap:20px;flex-wrap:wrap;padding-top:12px;border-top:1px solid #EEF0F4">
                    <sc-for list="{{ o.breakdown }}" as="b" hint-placeholder-count="4">
                      <span style="display:flex;flex-direction:column;gap:2px">
                        <span style="font-size:11px;color:#9AA5A0">{{ b.label }}</span>
                        <span style="font-family:'DM Sans',Poppins,sans-serif;font-weight:600;font-size:13px;color:{{ b.ink }}">{{ b.value }}</span>
                      </span>
                    </sc-for>
                    <sc-if value="{{ o.canRefund }}" hint-placeholder-val="{{ false }}">
                      <button type="button" onClick="{{ o.onRefund }}" data-testid="refund" style="margin-left:auto;align-self:center;height:38px;padding:0 16px;border:1px solid #F3D6D2;border-radius:8px;background:#FFFFFF;color:#C0392B;font-family:Poppins,sans-serif;font-size:12.5px;font-weight:600;cursor:pointer" style-hover="background:#FDF1EF">Refund this order</button>
                    </sc-if>
                  </div>
                </div>
              </sc-if>
            </div>
          </sc-for>
        </div>

        <sc-if value="{{ showPager }}" hint-placeholder-val="{{ false }}">
          <nav aria-label="Pagination" style="display:flex;justify-content:center;gap:8px">
            <button type="button" onClick="{{ onPrev }}" disabled="{{ prevDisabled }}" aria-label="Previous page" style="width:40px;height:40px;border:1px solid #E7E9EE;border-radius:8px;background:#FFFFFF;display:grid;place-items:center;cursor:pointer;opacity:{{ prevOpacity }};color:#2B2B2B" style-hover="border-color:#3A836B">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
            </button>
            <span style="display:inline-flex;align-items:center;padding:0 14px;font-family:'DM Sans',Poppins,sans-serif;font-size:13.5px;color:#595959">{{ pageLabel }}</span>
            <button type="button" onClick="{{ onNext }}" disabled="{{ nextDisabled }}" aria-label="Next page" style="width:40px;height:40px;border:1px solid #E7E9EE;border-radius:8px;background:#FFFFFF;display:grid;place-items:center;cursor:pointer;opacity:{{ nextOpacity }};color:#2B2B2B" style-hover="border-color:#3A836B">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
            </button>
          </nav>
        </sc-if>
      </sc-if>
    </div>

  </dc-import>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
const BADGES = {
  completed: { bg: '#EAF7F1', ink: '#3A836B', label: 'Completed' },
  refunded: { bg: '#F5EDFF', ink: '#7A5FA8', label: 'Refunded' },
  cancelled: { bg: '#F3F4F6', ink: '#595959', label: 'Cancelled' },
  failed: { bg: '#FDF1EF', ink: '#C0392B', label: 'Failed' },
  processing: { bg: '#FFF2DE', ink: '#B9913E', label: 'Processing' },
};

class Component extends DCLogic {
  state = { loading: true, rows: [], meta: null, counts: {}, user: null, status: '', query: '', page: 1, open: {} };

  async componentDidMount() {
    const [app, orders, rules, db] = await Promise.all([
      import('./assets/js/app.js'),
      import('./assets/js/repositories/ordersRepo.js'),
      import('./assets/js/business-rules.js'),
      import('./assets/js/db.js'),
    ]);
    await app.boot();
    Object.assign(this, { app, orders, rules, db });
    const user = app.auth.requireRole('admin');
    if (!user) return;
    this.user = user;
    this.setState({ user });
    await this.load();
  }

  async load() {
    const res = await this.orders.listOrders({
      status: this.state.status || undefined,
      q: this.state.query,
      page: this.state.page, pageSize: 15,
    });
    const all = this.db.findAll('orders').rows;
    this.setState({
      loading: false, rows: res.data, meta: res.meta,
      counts: {
        all: all.length,
        completed: all.filter(o => o.status === 'completed').length,
        refunded: all.filter(o => o.status === 'refunded').length,
        failed: all.filter(o => o.status === 'failed' || o.status === 'cancelled').length,
      },
    });
  }

  money(n) { return '$' + Number(n || 0).toFixed(2); }

  settle(item) {
    const v = this.db.findById('vendors', item.vendorId);
    return this.rules.settleLine({ price: item.price, planCode: (v && v.planCode) || item.planCode || 'basic' });
  }

  renderVals() {
    const url = this.app ? this.app.router.url : (() => '#');
    const { loading, rows, meta, counts, status, query, page, open } = this.state;
    const pages = meta ? meta.totalPages : 1;

    return {
      subtitle: counts.all ? counts.all + ' orders · ' + counts.completed + ' completed' : '',
      loading, query,
      isEmpty: !loading && rows.length === 0,
      hasRows: !loading && rows.length > 0,
      emptyTitle: query || status ? 'Nothing matches that view' : 'No orders yet',
      emptyBody: query || status
        ? 'Try clearing the search or choosing a different status.'
        : 'Orders appear here as soon as buyers complete a purchase.',

      tabs: [
        { key: '', label: 'All', n: counts.all },
        { key: 'completed', label: 'Completed', n: counts.completed },
        { key: 'refunded', label: 'Refunded', n: counts.refunded },
        { key: 'failed', label: 'Failed', n: counts.failed },
      ].map(t => {
        const on = t.key === status;
        return {
          label: t.label,
          count: String(t.n || 0),
          pressed: on ? 'true' : 'false',
          bg: on ? '#3A836B' : '#FFFFFF',
          border: on ? '#3A836B' : '#E7E9EE',
          ink: on ? '#FFFFFF' : '#29483C',
          pillBg: on ? 'rgba(255,255,255,.22)' : '#F1F3F6',
          pillInk: on ? '#FFFFFF' : '#595959',
          onPick: () => this.setState({ status: t.key, page: 1 }, () => this.load()),
        };
      }),

      rows: rows.map(o => {
        const b = BADGES[o.status] || BADGES.completed;
        const isOpen = !!open[o.id];
        let comm = 0, vend = 0;
        o.items.forEach(i => { const s = this.settle(i); comm += s.commission + s.transactionFee; vend += s.vendorEarnings; });
        return {
          reference: o.reference,
          customer: o.customerName,
          email: o.customerEmail,
          date: new Date(o.placedAt).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }),
          vendorLine: o.vendorNames.join(', '),
          statusLabel: b.label, badgeBg: b.bg, badgeInk: b.ink,
          total: this.money(o.total),
          commission: this.money(comm) + ' comm.',
          open: isOpen,
          expanded: isOpen ? 'true' : 'false',
          chevron: isOpen ? 0 : -90,
          rowBg: isOpen ? '#FBFCFD' : '#FFFFFF',
          onToggle: () => this.setState(s => ({ open: Object.assign({}, s.open, { [o.id]: !s.open[o.id] }) })),
          items: o.items.map(i => {
            const s = this.settle(i);
            const v = this.db.findById('vendors', i.vendorId);
            return {
              title: i.title.length > 52 ? i.title.slice(0, 50).trim() + '…' : i.title,
              cover: i.cover,
              href: url('product', { id: i.productId }),
              vendorName: v ? v.storeName : 'Unknown vendor',
              price: this.money(i.price),
              vendorEarnings: this.money(s.vendorEarnings) + ' vendor',
              commission: this.money(s.commission + s.transactionFee) + ' platform',
            };
          }),
          breakdown: [
            { label: 'Subtotal', value: this.money(o.subtotal), ink: '#29483C' },
            { label: 'Discount', value: o.discount ? '−' + this.money(o.discount) : '—', ink: '#595959' },
            { label: 'Vendor earnings', value: this.money(vend), ink: '#3A836B' },
            { label: 'Platform take', value: this.money(comm), ink: '#B9913E' },
            { label: 'Paid by', value: o.paymentMethod, ink: '#29483C' },
          ],
          canRefund: o.status === 'completed',
          onRefund: async () => {
            const ok = await this.app.confirmDialog({
              title: 'Refund ' + o.reference + '?',
              body: this.money(o.total) + ' to ' + o.customerName + '. The order is marked refunded and the vendor earnings reversed.',
              confirmLabel: 'Refund order',
            });
            if (!ok) return;
            await this.orders.refundOrder(o.id, 'Refunded by administrator');
            await this.load();
            this.app.toast('Order refunded.', 'info');
          },
        };
      }),

      showPager: !loading && pages > 1,
      pageLabel: 'Page ' + page + ' of ' + pages,
      prevDisabled: page <= 1, nextDisabled: page >= pages,
      prevOpacity: page <= 1 ? 0.4 : 1, nextOpacity: page >= pages ? 0.4 : 1,
      onPrev: () => { if (page > 1) this.setState({ page: page - 1 }, () => this.load()); },
      onNext: () => { if (page < pages) this.setState({ page: page + 1 }, () => this.load()); },
      onSearch: e => {
        const v = e.target.value;
        clearTimeout(this._t);
        this.setState({ query: v, page: 1 });
        this._t = setTimeout(() => this.load(), 240);
      },
    };
  }
}

</script>
</body>
</html>
