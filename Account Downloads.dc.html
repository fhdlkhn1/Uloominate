<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
<script>
(function () {
  if (location.protocol !== 'file:') return;
  var here = decodeURIComponent(location.pathname.replace(/\/[^\/]*$/, ''));
  var win = /^\/[A-Za-z]:/.test(here);
  var dir = win ? here.slice(1).replace(/\//g, '\\') : here;
  document.addEventListener('DOMContentLoaded', function () {
    var o = document.createElement('div');
    o.setAttribute('data-file-protocol-guard', '');
    o.style.cssText = 'position:fixed;inset:0;z-index:2147483647;background:#F2FAF7;overflow:auto;font-family:Poppins,system-ui,sans-serif;color:#121212;padding:40px 24px';
    o.innerHTML =
      '<div style="max-width:680px;margin:0 auto;background:#fff;border:1px solid #E6EFEA;border-radius:16px;padding:32px;box-shadow:0 1px 2px rgba(18,18,18,.04),0 24px 48px -32px rgba(41,72,60,.4)">' +
      '<h1 style="margin:0 0 12px;font-weight:600;font-size:26px;line-height:1.2;color:#29483C">One step before this page works</h1>' +
      '<p style="margin:0 0 18px;font-size:15px;line-height:1.75;color:#444">You opened this file straight from disk. Browsers block a local file from loading its data and shared components, so the page renders its layout and then stops at <em>Loading…</em>. Nothing is broken \u2014 it just has to be served over <code>http://</code>.</p>' +
      '<div style="background:#EAF7F1;border-left:4px solid #3A836B;border-radius:10px;padding:16px 18px;margin:0 0 18px">' +
      '<p style="margin:0 0 10px;font-weight:600;font-size:14.5px;color:#29483C">Quickest fix \u2014 no server at all</p>' +
      '<p style="margin:0 0 13px;font-size:14px;line-height:1.7;color:#444">Open <code>standalone.html</code> in this same folder. It is the whole prototype in one self-contained file, so it runs straight from disk. Screens that take an id in the address \u2014 product detail, vendor storefront \u2014 need the served copy below.</p>' +
      '<a href="standalone.html" style="display:inline-flex;align-items:center;height:44px;padding:0 20px;border-radius:8px;background:#3A836B;color:#fff;font-weight:600;font-size:14px;text-decoration:none">Open standalone.html</a></div>' +
      '<div style="background:#F5F8F7;border-left:4px solid #DCE7E1;border-radius:10px;padding:16px 18px;margin:0 0 18px">' +
      '<p style="margin:0 0 10px;font-weight:600;font-size:14.5px;color:#29483C">Or serve the folder</p>' +
      '<p style="margin:0;font-size:14px;line-height:1.7;color:#444">In the prototype folder, <strong>right-click</strong> ' +
      (win ? '<code>start-windows.bat</code> and choose <strong>Run</strong>' : '<code>start-mac-linux.command</code> and choose <strong>Open</strong>, then confirm') +
      '. macOS blocks these on a plain double-click the first time \u2014 right-click and Open gets past it.</p></div>' +
      '<p style="margin:0 0 8px;font-weight:600;font-size:14.5px;color:#29483C">Or do it by hand</p>' +
      '<pre style="margin:0 0 18px;background:#122A22;color:#E8F2ED;border-radius:10px;padding:16px 18px;overflow-x:auto;font-size:13.5px;line-height:1.6;font-family:ui-monospace,monospace">cd "' + dir + '"\n' + (win ? 'python' : 'python3') + ' -m http.server 8000</pre>' +
      '<p style="margin:0 0 20px;font-size:14px;line-height:1.7;color:#444">Then open <a href="http://localhost:8000/Sitemap.dc.html" style="color:#3A836B;font-weight:600">http://localhost:8000/Sitemap.dc.html</a></p>' +
      '<a href="START-HERE.html" style="display:inline-flex;align-items:center;height:48px;padding:0 22px;border-radius:8px;background:#3A836B;color:#fff;font-weight:600;font-size:15px;text-decoration:none">Full instructions</a>' +
      '</div>';
    document.body.appendChild(o);
  });
})();
</script>
</head>
<body>
<x-dc>
<helmet>
<title>My downloads — Uloominate</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;family=Montserrat+Alternates:wght@500&amp;family=Playfair+Display:wght@400&amp;family=DM+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet" />
<style>
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;font-family:Poppins,system-ui,sans-serif;color:#121212;background:#FFFFFF;-webkit-font-smoothing:antialiased}
  a{color:#3A836B;text-decoration:none}a:hover{color:#29483C}
  :focus-visible{outline:2px solid #3A836B;outline-offset:3px;border-radius:6px}
</style>
</helmet>
<div data-screen-label="C-02 Account Downloads" style="min-height:100vh;display:flex;flex-direction:column;background:#FFFFFF">
  <dc-import name="SiteHeader" hint-size="100%,140px"></dc-import>

  <main style="flex:1;max-width:1728px;margin:0 auto;width:100%;padding:32px clamp(20px,8vw,144px) 72px;display:flex;align-items:flex-start;gap:36px;flex-wrap:wrap">

    <nav aria-label="Account" style="flex:1 1 240px;max-width:260px;min-width:0;display:flex;flex-direction:column;gap:4px">
      <span style="padding:0 12px 10px;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#B9913E">My account</span>
      <sc-for list="{{ accountNav }}" as="n" hint-placeholder-count="6">
        <a href="{{ n.href }}" aria-current="{{ n.current }}" style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:10px;background:{{ n.bg }};font-weight:{{ n.weight }};font-size:14px;color:{{ n.ink }}" style-hover="background:#F2FAF7;color:#29483C">
          {{ n.label }}
          <sc-if value="{{ n.count }}" hint-placeholder-val="{{ false }}">
            <span style="min-width:22px;height:20px;padding:0 6px;border-radius:10px;background:{{ n.badgeBg }};color:{{ n.badgeInk }};font-family:'DM Sans',Poppins,sans-serif;font-size:11px;font-weight:700;line-height:20px;text-align:center">{{ n.count }}</span>
          </sc-if>
        </a>
      </sc-for>
    </nav>

    <div style="flex:999 1 520px;min-width:0;display:flex;flex-direction:column;gap:22px">

      <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap">
        <div style="display:flex;flex-direction:column;gap:6px;min-width:0">
          <h1 style="margin:0;font-weight:600;font-size:clamp(24px,2.4vw,32px);line-height:1.2;color:#29483C">Downloads</h1>
          <p style="margin:0;font-size:14px;line-height:1.6;color:#595959">{{ countLine }}</p>
        </div>
        <label style="display:flex;align-items:center;gap:8px;height:46px;padding:0 14px;border:1px solid #EDF0EE;border-radius:8px;background:#FFFFFF;flex:0 1 300px;min-width:200px">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#595959" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.4-3.4"></path></svg>
          <input type="search" value="{{ query }}" onInput="{{ onSearch }}" placeholder="Search your downloads" aria-label="Search your downloads" style="flex:1;min-width:0;border:none;outline:none;background:transparent;font-family:Poppins,sans-serif;font-size:14px;color:#121212" />
        </label>
      </div>

      <sc-if value="{{ loading }}" hint-placeholder-val="{{ true }}">
        <div aria-hidden="true" style="display:flex;flex-direction:column;gap:12px">
          <span style="height:92px;border-radius:14px;background:#F4F6F5"></span>
          <span style="height:92px;border-radius:14px;background:#F7F9F8"></span>
          <span style="height:92px;border-radius:14px;background:#F9FAFA"></span>
        </div>
      </sc-if>

      <sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ false }}">
        <div data-testid="downloads-empty" style="border:1px dashed #DCE7E1;background:#FCFDFC;border-radius:16px;padding:64px 40px;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center">
          <span style="width:76px;height:76px;border-radius:50%;background:#F2FAF7;display:grid;place-items:center">
            <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#3A836B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 11l5 5 5-5M4 20h16"></path></svg>
          </span>
          <h2 style="margin:0;font-weight:600;font-size:21px;color:#29483C">{{ emptyTitle }}</h2>
          <p style="margin:0;max-width:440px;font-size:15px;line-height:1.7;color:#595959">{{ emptyBody }}</p>
          <a href="{{ browseHref }}" style="margin-top:6px;display:inline-flex;align-items:center;height:48px;padding:0 24px;border-radius:8px;background:#3A836B;color:#FFFFFF;font-weight:600;font-size:15px" style-hover="background:#29483C;color:#FFFFFF">Browse resources</a>
        </div>
      </sc-if>

      <sc-if value="{{ hasRows }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;flex-direction:column;gap:12px">
          <sc-for list="{{ rows }}" as="r" hint-placeholder-count="4">
            <div data-testid="download-row" style="display:flex;align-items:center;gap:16px;border:1px solid #EDF0EE;border-radius:14px;padding:16px;flex-wrap:wrap;transition:border-color .18s ease" style-hover="border-color:#DCE7E1">
              <a href="{{ r.href }}" tabindex="-1" aria-hidden="true" style="flex:0 0 92px;width:92px;height:62px;border-radius:10px;overflow:hidden;background:#F3F4F6">
                <img src="{{ r.cover }}" alt="" loading="lazy" style="display:block;width:100%;height:100%;object-fit:cover" />
              </a>
              <div style="flex:1 1 240px;min-width:0;display:flex;flex-direction:column;gap:5px">
                <a href="{{ r.href }}" style="font-weight:600;font-size:15px;line-height:1.45;color:#121212" style-hover="color:#3A836B">{{ r.title }}</a>
                <span style="font-size:13px;color:#595959">{{ r.meta }}</span>
                <span style="font-family:'DM Sans',Poppins,sans-serif;font-size:12px;color:#9AA5A0">Purchased {{ r.purchased }} · {{ r.reference }}</span>
              </div>
              <div style="flex:0 0 auto;display:flex;align-items:center;gap:10px">
                <sc-if value="{{ r.available }}" hint-placeholder-val="{{ true }}">
                  <button type="button" onClick="{{ r.onDownload }}" data-testid="download-button" aria-label="{{ r.downloadLabel }}" style="display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 20px;border:none;border-radius:8px;background:#3A836B;color:#FFFFFF;font-family:Poppins,sans-serif;font-weight:600;font-size:14px;cursor:pointer" style-hover="background:#29483C">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 11l5 5 5-5M4 20h16"></path></svg>
                    Download
                  </button>
                </sc-if>
                <sc-if value="{{ r.unavailable }}" hint-placeholder-val="{{ false }}">
                  <span style="display:inline-flex;align-items:center;height:44px;padding:0 16px;border-radius:8px;background:#FFF2DE;font-size:13px;font-weight:600;color:#B9913E">Temporarily unavailable</span>
                </sc-if>
              </div>
            </div>
          </sc-for>
        </div>

        <sc-if value="{{ showPager }}" hint-placeholder-val="{{ false }}">
          <nav aria-label="Pagination" style="display:flex;justify-content:center;gap:8px;padding-top:12px">
            <button type="button" onClick="{{ onPrev }}" disabled="{{ prevDisabled }}" aria-label="Previous page" style="width:40px;height:40px;border:1px solid #EDF0EE;border-radius:8px;background:#FFFFFF;color:#2B2B2B;display:grid;place-items:center;cursor:pointer;opacity:{{ prevOpacity }}" style-hover="border-color:#3A836B">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
            </button>
            <span style="display:inline-flex;align-items:center;padding:0 14px;font-family:'DM Sans',Poppins,sans-serif;font-size:14px;color:#595959">{{ pageLabel }}</span>
            <button type="button" onClick="{{ onNext }}" disabled="{{ nextDisabled }}" aria-label="Next page" style="width:40px;height:40px;border:1px solid #EDF0EE;border-radius:8px;background:#FFFFFF;color:#2B2B2B;display:grid;place-items:center;cursor:pointer;opacity:{{ nextOpacity }}" style-hover="border-color:#3A836B">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
            </button>
          </nav>
        </sc-if>
      </sc-if>
    </div>
  </main>

  <dc-import name="SiteFooter" hint-size="100%,330px"></dc-import>
  <dc-import name="DevToolbar" page="accountDownloads" hint-size="0px,0px"></dc-import>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
class Component extends DCLogic {
  state = { loading: true, rows: [], meta: null, user: null, query: '', page: 1, counts: {} };

  async componentDidMount() {
    const [app, orders, db] = await Promise.all([
      import('./assets/js/app.js'),
      import('./assets/js/repositories/ordersRepo.js'),
      import('./assets/js/db.js'),
    ]);
    await app.boot();
    this.app = app; this.orders = orders; this.db = db;
    const user = app.auth.requireRole('customer', 'vendor', 'admin');
    if (!user) return;
    this.user = user;
    this.setState({ user });
    await this.load();
  }

  async load() {
    this.setState({ loading: true });
    const u = (this.user || this.state.user);
    const res = await this.orders.listDownloads(u.id, { q: this.state.query, page: this.state.page, pageSize: 8 });
    this.setState({
      loading: false, rows: res.data, meta: res.meta,
      counts: {
        orders: this.db.findAll('orders', { filter: { customerId: u.id } }).total,
        wishlist: this.db.findAll('wishlist', { filter: { userId: u.id } }).total,
        reviews: this.db.findAll('reviews', { filter: { userId: u.id } }).total,
        following: this.db.findAll('follows', { filter: { userId: u.id } }).total,
      },
    });
  }

  nav() {
    const url = this.app.router.url;
    const c = this.state.counts;
    return [
      { key: 'accountOrders', label: 'Orders', count: c.orders },
      { key: 'accountDownloads', label: 'Downloads', count: this.state.meta ? this.state.meta.total : 0 },
      { key: 'accountWishlist', label: 'Wishlist', count: c.wishlist },
      { key: 'accountReviews', label: 'My reviews', count: c.reviews },
      { key: 'accountFollowing', label: 'Following', count: c.following },
      { key: 'accountProfile', label: 'Profile', count: 0 },
    ].map(n => {
      const active = n.key === 'accountDownloads';
      return {
        label: n.label,
        href: url(n.key),
        current: active ? 'page' : undefined,
        bg: active ? '#F2FAF7' : 'transparent',
        ink: active ? '#29483C' : '#595959',
        weight: active ? 600 : 500,
        count: n.count ? String(n.count) : '',
        badgeBg: active ? '#3A836B' : '#EDF0EE',
        badgeInk: active ? '#FFFFFF' : '#595959',
      };
    });
  }

  renderVals() {
    const url = this.app ? this.app.router.url : (() => '#');
    const { loading, rows, meta, query, page } = this.state;
    const total = meta ? meta.total : 0;
    const pages = meta ? meta.totalPages : 1;

    return {
      accountNav: this.app ? this.nav() : [],
      browseHref: url('browse'),
      loading,
      query,
      countLine: loading ? 'Loading…'
        : total === 0 ? 'Nothing here yet'
        : total + (total === 1 ? ' resource' : ' resources') + ' — download as often as you like, forever',
      isEmpty: !loading && rows.length === 0,
      hasRows: !loading && rows.length > 0,
      emptyTitle: query ? 'No downloads match that search' : 'You have not downloaded anything yet',
      emptyBody: query
        ? 'Try a shorter search, or clear it to see everything you own.'
        : 'Resources you buy appear here permanently, and you can re-download them any number of times.',

      rows: rows.map(r => ({
        title: r.title,
        cover: r.cover,
        href: url('product', { id: r.productId }),
        meta: [r.fileType, r.pageCount ? r.pageCount + ' pages' : null, r.fileSizeMb ? r.fileSizeMb + ' MB' : null].filter(Boolean).join(' · '),
        purchased: new Date(r.purchasedAt).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }),
        reference: r.orderReference,
        available: r.available,
        unavailable: !r.available,
        downloadLabel: 'Download ' + r.title,
        onDownload: async () => {
          try {
            await this.orders.downloadUrl((this.user || this.state.user).id, r.productId);
            this.app.toast('Download started: ' + (r.fileName || r.title), 'success');
          } catch (err) {
            this.app.toast(this.app.readError(err).message, 'error');
          }
        },
      })),

      showPager: !loading && pages > 1,
      pageLabel: 'Page ' + page + ' of ' + pages,
      prevDisabled: page <= 1,
      nextDisabled: page >= pages,
      prevOpacity: page <= 1 ? 0.4 : 1,
      nextOpacity: page >= pages ? 0.4 : 1,
      onPrev: () => { if (page > 1) this.setState({ page: page - 1 }, () => this.load()); },
      onNext: () => { if (page < pages) this.setState({ page: page + 1 }, () => this.load()); },
      onSearch: e => {
        const v = e.target.value;
        clearTimeout(this._t);
        this.setState({ query: v, page: 1 });
        this._t = setTimeout(() => this.load(), 220);
      },
    };
  }
}

</script>
</body>
</html>
