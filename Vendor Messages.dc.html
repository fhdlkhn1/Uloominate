<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
<script>
(function () {
  if (location.protocol !== 'file:') return;
  var here = decodeURIComponent(location.pathname.replace(/\/[^\/]*$/, ''));
  var win = /^\/[A-Za-z]:/.test(here);
  var dir = win ? here.slice(1).replace(/\//g, '\\') : here;
  document.addEventListener('DOMContentLoaded', function () {
    var o = document.createElement('div');
    o.setAttribute('data-file-protocol-guard', '');
    o.style.cssText = 'position:fixed;inset:0;z-index:2147483647;background:#F2FAF7;overflow:auto;font-family:Poppins,system-ui,sans-serif;color:#121212;padding:40px 24px';
    o.innerHTML =
      '<div style="max-width:680px;margin:0 auto;background:#fff;border:1px solid #E6EFEA;border-radius:16px;padding:32px;box-shadow:0 1px 2px rgba(18,18,18,.04),0 24px 48px -32px rgba(41,72,60,.4)">' +
      '<h1 style="margin:0 0 12px;font-weight:600;font-size:26px;line-height:1.2;color:#29483C">One step before this page works</h1>' +
      '<p style="margin:0 0 18px;font-size:15px;line-height:1.75;color:#444">You opened this file straight from disk. Browsers block a local file from loading its data and shared components, so the page renders its layout and then stops at <em>Loading…</em>. Nothing is broken \u2014 it just has to be served over <code>http://</code>.</p>' +
      '<div style="background:#EAF7F1;border-left:4px solid #3A836B;border-radius:10px;padding:16px 18px;margin:0 0 18px">' +
      '<p style="margin:0 0 10px;font-weight:600;font-size:14.5px;color:#29483C">Quickest fix \u2014 no server at all</p>' +
      '<p style="margin:0 0 13px;font-size:14px;line-height:1.7;color:#444">Open <code>standalone.html</code> in this same folder. It is the whole prototype in one self-contained file, so it runs straight from disk. Screens that take an id in the address \u2014 product detail, vendor storefront \u2014 need the served copy below.</p>' +
      '<a href="standalone.html" style="display:inline-flex;align-items:center;height:44px;padding:0 20px;border-radius:8px;background:#3A836B;color:#fff;font-weight:600;font-size:14px;text-decoration:none">Open standalone.html</a></div>' +
      '<div style="background:#F5F8F7;border-left:4px solid #DCE7E1;border-radius:10px;padding:16px 18px;margin:0 0 18px">' +
      '<p style="margin:0 0 10px;font-weight:600;font-size:14.5px;color:#29483C">Or serve the folder</p>' +
      '<p style="margin:0;font-size:14px;line-height:1.7;color:#444">In the prototype folder, <strong>right-click</strong> ' +
      (win ? '<code>start-windows.bat</code> and choose <strong>Run</strong>' : '<code>start-mac-linux.command</code> and choose <strong>Open</strong>, then confirm') +
      '. macOS blocks these on a plain double-click the first time \u2014 right-click and Open gets past it.</p></div>' +
      '<p style="margin:0 0 8px;font-weight:600;font-size:14.5px;color:#29483C">Or do it by hand</p>' +
      '<pre style="margin:0 0 18px;background:#122A22;color:#E8F2ED;border-radius:10px;padding:16px 18px;overflow-x:auto;font-size:13.5px;line-height:1.6;font-family:ui-monospace,monospace">cd "' + dir + '"\n' + (win ? 'python' : 'python3') + ' -m http.server 8000</pre>' +
      '<p style="margin:0 0 20px;font-size:14px;line-height:1.7;color:#444">Then open <a href="http://localhost:8000/Sitemap.dc.html" style="color:#3A836B;font-weight:600">http://localhost:8000/Sitemap.dc.html</a></p>' +
      '<a href="START-HERE.html" style="display:inline-flex;align-items:center;height:48px;padding:0 22px;border-radius:8px;background:#3A836B;color:#fff;font-weight:600;font-size:15px;text-decoration:none">Full instructions</a>' +
      '</div>';
    document.body.appendChild(o);
  });
})();
</script>
</head>
<body>
<x-dc>
<helmet>
<title>Messages — Uloominate</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;family=Montserrat+Alternates:wght@500&amp;family=DM+Sans:wght@400;500;700&amp;family=Roboto:wght@400&amp;display=swap" rel="stylesheet" />
<style>
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;font-family:Poppins,system-ui,sans-serif;color:#121212;background:#F7FAF9;-webkit-font-smoothing:antialiased}
  a{color:#3A836B;text-decoration:none}a:hover{color:#29483C}
  :focus-visible{outline:2px solid #3A836B;outline-offset:3px;border-radius:6px}
</style>
</helmet>
<div data-screen-label="V-08 Vendor Messages">
  <dc-import name="VendorShell" active="vendorMessages" title="Messages" subtitle="{{ subtitle }}" hint-size="100%,100vh">

    <div style="display:flex;flex-direction:column;gap:18px">

      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="3">
          <button type="button" onClick="{{ t.onPick }}" aria-pressed="{{ t.pressed }}" style="display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 15px;border:1px solid {{ t.border }};border-radius:9999px;background:{{ t.bg }};font-family:Poppins,sans-serif;font-size:13px;font-weight:600;color:{{ t.ink }};cursor:pointer">
            {{ t.label }}
            <span style="min-width:20px;height:19px;padding:0 5px;border-radius:10px;background:{{ t.pillBg }};color:{{ t.pillInk }};font-family:'DM Sans',Poppins,sans-serif;font-size:11px;line-height:19px;text-align:center">{{ t.count }}</span>
          </button>
        </sc-for>
      </div>

      <sc-if value="{{ loading }}" hint-placeholder-val="{{ true }}">
        <div aria-hidden="true" style="display:flex;flex-direction:column;gap:10px">
          <span style="height:104px;border-radius:14px;background:#EFF3F1"></span>
          <span style="height:104px;border-radius:14px;background:#F2F6F4"></span>
        </div>
      </sc-if>

      <sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ false }}">
        <div data-testid="messages-empty" style="background:#FFFFFF;border:1px dashed #DCE7E1;border-radius:16px;padding:60px 40px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center">
          <span style="width:70px;height:70px;border-radius:50%;background:#F2FAF7;display:grid;place-items:center">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#3A836B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2Z"></path></svg>
          </span>
          <h2 style="margin:0;font-weight:600;font-size:19px;color:#29483C">{{ emptyTitle }}</h2>
          <p style="margin:0;max-width:420px;font-size:13.5px;line-height:1.7;color:#595959">{{ emptyBody }}</p>
        </div>
      </sc-if>

      <sc-if value="{{ hasRows }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;flex-direction:column;gap:12px">
          <sc-for list="{{ rows }}" as="m" hint-placeholder-count="4">
            <article data-testid="message-card" style="background:#FFFFFF;border:1px solid {{ m.cardBorder }};border-radius:16px;overflow:hidden">

              <div style="padding:18px;display:flex;gap:14px;flex-wrap:wrap">
                <span aria-hidden="true" style="flex:0 0 40px;width:40px;height:40px;border-radius:50%;background:#F2FAF7;color:#3A836B;display:grid;place-items:center;font-size:13.5px;font-weight:700">{{ m.initials }}</span>

                <div style="flex:1 1 260px;min-width:0;display:flex;flex-direction:column;gap:7px">
                  <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
                    <span style="font-weight:600;font-size:14.5px;color:#29483C">{{ m.subject }}</span>
                    <span style="padding:3px 9px;border-radius:9999px;background:{{ m.badgeBg }};color:{{ m.badgeInk }};font-size:11px;font-weight:700">{{ m.statusLabel }}</span>
                    <span style="padding:3px 9px;border-radius:9999px;background:#F3F4F6;color:#595959;font-size:11px;font-weight:600">{{ m.kindLabel }}</span>
                  </div>
                  <span style="font-family:'DM Sans',Poppins,sans-serif;font-size:12px;color:#9AA5A0">{{ m.meta }}</span>
                  <p style="margin:0;font-size:13.5px;line-height:1.7;color:#121212">{{ m.body }}</p>

                  <sc-if value="{{ m.hasProduct }}" hint-placeholder-val="{{ false }}">
                    <a href="{{ m.productHref }}" style="display:inline-flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid #F1F4F2;border-radius:10px;background:#FCFDFC;width:max-content;max-width:100%" style-hover="background:#F2FAF7;color:inherit">
                      <span style="flex:0 0 44px;width:44px;height:30px;border-radius:6px;overflow:hidden;background:#F3F4F6">
                        <img src="{{ m.productCover }}" alt="" loading="lazy" style="display:block;width:100%;height:100%;object-fit:cover" />
                      </span>
                      <span style="font-size:12.5px;font-weight:500;color:#29483C;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ m.productTitle }}</span>
                    </a>
                  </sc-if>

                  <sc-if value="{{ m.hasReplies }}" hint-placeholder-val="{{ false }}">
                    <div style="display:flex;flex-direction:column;gap:8px;padding-top:4px">
                      <sc-for list="{{ m.replies }}" as="r" hint-placeholder-count="1">
                        <div style="border-left:3px solid #3A836B;background:#F2FAF7;border-radius:0 10px 10px 0;padding:10px 12px;display:flex;flex-direction:column;gap:3px">
                          <span style="font-size:11.5px;font-weight:700;color:#3A836B">You replied</span>
                          <span style="font-size:13px;line-height:1.65;color:#121212">{{ r.body }}</span>
                          <span style="font-family:'DM Sans',Poppins,sans-serif;font-size:11px;color:#9AA5A0">{{ r.at }}</span>
                        </div>
                      </sc-for>
                    </div>
                  </sc-if>
                </div>
              </div>

              <sc-if value="{{ m.replyOpen }}" hint-placeholder-val="{{ false }}">
                <form onSubmit="{{ m.onSend }}" style="padding:0 18px 18px;display:flex;flex-direction:column;gap:10px">
                  <label for="{{ m.inputId }}" style="font-family:Roboto,Poppins,sans-serif;font-size:12px;color:#49454F">Your reply</label>
                  <textarea id="{{ m.inputId }}" name="body" rows="3" required="required" placeholder="Answer the question directly — buyers usually decide from this reply." style="border:1px solid #DCE7E1;border-radius:8px;padding:10px 12px;font-family:Poppins,sans-serif;font-size:14px;line-height:1.65;resize:vertical;outline:none" style-focus="border-color:#3A836B"></textarea>
                  <div style="display:flex;gap:10px;flex-wrap:wrap">
                    <button type="submit" style="height:42px;padding:0 20px;border:none;border-radius:8px;background:#3A836B;color:#FFFFFF;font-family:Poppins,sans-serif;font-weight:600;font-size:13.5px;cursor:pointer" style-hover="background:#29483C">Send reply</button>
                    <button type="button" onClick="{{ m.onCancel }}" style="height:42px;padding:0 16px;border:1px solid #E9EFEC;border-radius:8px;background:#FFFFFF;font-family:Poppins,sans-serif;font-weight:600;font-size:13.5px;color:#29483C;cursor:pointer" style-hover="background:#F2FAF7">Cancel</button>
                  </div>
                </form>
              </sc-if>

              <sc-if value="{{ m.replyClosed }}" hint-placeholder-val="{{ true }}">
                <div style="padding:0 18px 18px">
                  <button type="button" onClick="{{ m.onReply }}" data-testid="reply-button" style="height:42px;padding:0 20px;border:1px solid #DCE7E1;border-radius:8px;background:#FFFFFF;font-family:Poppins,sans-serif;font-weight:600;font-size:13.5px;color:#3A836B;cursor:pointer" style-hover="background:#F2FAF7;border-color:#3A836B">{{ m.replyCta }}</button>
                </div>
              </sc-if>
            </article>
          </sc-for>
        </div>
      </sc-if>
    </div>

  </dc-import>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
class Component extends DCLogic {
  state = { loading: true, rows: [], user: null, status: '', counts: {}, replyTo: null };

  async componentDidMount() {
    const [app, platform, db] = await Promise.all([
      import('./assets/js/app.js'),
      import('./assets/js/repositories/platformRepo.js'),
      import('./assets/js/db.js'),
    ]);
    await app.boot();
    Object.assign(this, { app, platform, db });
    const user = app.auth.requireRole('vendor', 'admin');
    if (!user) return;
    this.user = user;
    this.vid = user.vendorId || (user.vendor && user.vendor.id) || 'v-1';
    this.setState({ user });
    await this.load();
  }

  async load() {
    const res = await this.platform.listMessages({
      vendorId: this.vid,
      status: this.state.status || undefined,
      pageSize: 50,
    });
    const all = this.db.findAll('messages', { filter: { vendorId: this.vid } }).rows;
    this.setState({
      loading: false, rows: res.data,
      counts: {
        all: all.length,
        open: all.filter(m => m.status === 'open').length,
        answered: all.filter(m => m.status === 'answered').length,
      },
    });
  }

  renderVals() {
    const url = this.app ? this.app.router.url : (() => '#');
    const { loading, rows, status, counts, replyTo } = this.state;

    return {
      subtitle: counts.open ? counts.open + (counts.open === 1 ? ' message needs an answer' : ' messages need an answer') : 'Nothing waiting on you',
      loading,
      isEmpty: !loading && rows.length === 0,
      hasRows: !loading && rows.length > 0,
      emptyTitle: status === 'open' ? 'Nothing waiting on you' : status === 'answered' ? 'No answered messages yet' : 'No messages yet',
      emptyBody: status
        ? 'Try a different filter to see your other messages.'
        : 'Buyers can ask a question from any of your product pages. Their message arrives here.',

      tabs: [
        { key: '', label: 'All', n: counts.all },
        { key: 'open', label: 'Needs a reply', n: counts.open },
        { key: 'answered', label: 'Answered', n: counts.answered },
      ].map(t => {
        const on = t.key === status;
        return {
          label: t.label,
          count: String(t.n || 0),
          pressed: on ? 'true' : 'false',
          bg: on ? '#3A836B' : '#FFFFFF',
          border: on ? '#3A836B' : '#E9EFEC',
          ink: on ? '#FFFFFF' : '#29483C',
          pillBg: on ? 'rgba(255,255,255,.22)' : '#F1F4F2',
          pillInk: on ? '#FFFFFF' : '#595959',
          onPick: () => this.setState({ status: t.key, replyTo: null }, () => this.load()),
        };
      }),

      rows: rows.map(m => {
        const open = m.status === 'open';
        const replies = m.replies || [];
        const isReplying = replyTo === m.id;
        return {
          subject: m.subject,
          body: m.body,
          initials: (m.fromName || '?').split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase(),
          meta: m.fromName + ' · ' + new Date(m.createdAt).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }),
          statusLabel: open ? 'Needs a reply' : 'Answered',
          badgeBg: open ? '#FFF2DE' : '#EAF7F1',
          badgeInk: open ? '#B9913E' : '#3A836B',
          kindLabel: m.kind === 'enquiry' ? 'Product question' : 'Message',
          cardBorder: open ? '#F0E3CB' : '#E9EFEC',
          hasProduct: !!m.productId,
          productTitle: m.productTitle || '',
          productCover: m.productCover || 'assets/img/cover-1.jpg',
          productHref: m.productId ? url('product', { id: m.productId }) : '#',
          hasReplies: replies.length > 0,
          replies: replies.map(r => ({
            body: r.body,
            at: new Date(r.at).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }),
          })),
          replyOpen: isReplying,
          replyClosed: !isReplying,
          replyCta: replies.length ? 'Reply again' : 'Write a reply',
          inputId: 'reply-' + m.id,
          onReply: () => this.setState({ replyTo: m.id }),
          onCancel: () => this.setState({ replyTo: null }),
          onSend: async e => {
            e.preventDefault();
            const body = new FormData(e.target).get('body');
            if (!String(body || '').trim()) return;
            await this.platform.replyToMessage(m.id, body);
            this.setState({ replyTo: null });
            await this.load();
            this.app.toast('Reply sent to ' + m.fromName + '.', 'success');
          },
        };
      }),
    };
  }
}

</script>
</body>
</html>
