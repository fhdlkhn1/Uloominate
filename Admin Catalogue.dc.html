<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
<script>
(function () {
  if (location.protocol !== 'file:') return;
  var here = decodeURIComponent(location.pathname.replace(/\/[^\/]*$/, ''));
  var win = /^\/[A-Za-z]:/.test(here);
  var dir = win ? here.slice(1).replace(/\//g, '\\') : here;
  document.addEventListener('DOMContentLoaded', function () {
    var o = document.createElement('div');
    o.setAttribute('data-file-protocol-guard', '');
    o.style.cssText = 'position:fixed;inset:0;z-index:2147483647;background:#F2FAF7;overflow:auto;font-family:Poppins,system-ui,sans-serif;color:#121212;padding:40px 24px';
    o.innerHTML =
      '<div style="max-width:680px;margin:0 auto;background:#fff;border:1px solid #E6EFEA;border-radius:16px;padding:32px;box-shadow:0 1px 2px rgba(18,18,18,.04),0 24px 48px -32px rgba(41,72,60,.4)">' +
      '<h1 style="margin:0 0 12px;font-weight:600;font-size:26px;line-height:1.2;color:#29483C">One step before this page works</h1>' +
      '<p style="margin:0 0 18px;font-size:15px;line-height:1.75;color:#444">You opened this file straight from disk. Browsers block a local file from loading its data and shared components, so the page renders its layout and then stops at <em>Loading…</em>. Nothing is broken \u2014 it just has to be served over <code>http://</code>.</p>' +
      '<div style="background:#EAF7F1;border-left:4px solid #3A836B;border-radius:10px;padding:16px 18px;margin:0 0 18px">' +
      '<p style="margin:0 0 10px;font-weight:600;font-size:14.5px;color:#29483C">Quickest fix \u2014 no server at all</p>' +
      '<p style="margin:0 0 13px;font-size:14px;line-height:1.7;color:#444">Open <code>standalone.html</code> in this same folder. It is the whole prototype in one self-contained file, so it runs straight from disk. Screens that take an id in the address \u2014 product detail, vendor storefront \u2014 need the served copy below.</p>' +
      '<a href="standalone.html" style="display:inline-flex;align-items:center;height:44px;padding:0 20px;border-radius:8px;background:#3A836B;color:#fff;font-weight:600;font-size:14px;text-decoration:none">Open standalone.html</a></div>' +
      '<div style="background:#F5F8F7;border-left:4px solid #DCE7E1;border-radius:10px;padding:16px 18px;margin:0 0 18px">' +
      '<p style="margin:0 0 10px;font-weight:600;font-size:14.5px;color:#29483C">Or serve the folder</p>' +
      '<p style="margin:0;font-size:14px;line-height:1.7;color:#444">In the prototype folder, <strong>right-click</strong> ' +
      (win ? '<code>start-windows.bat</code> and choose <strong>Run</strong>' : '<code>start-mac-linux.command</code> and choose <strong>Open</strong>, then confirm') +
      '. macOS blocks these on a plain double-click the first time \u2014 right-click and Open gets past it.</p></div>' +
      '<p style="margin:0 0 8px;font-weight:600;font-size:14.5px;color:#29483C">Or do it by hand</p>' +
      '<pre style="margin:0 0 18px;background:#122A22;color:#E8F2ED;border-radius:10px;padding:16px 18px;overflow-x:auto;font-size:13.5px;line-height:1.6;font-family:ui-monospace,monospace">cd "' + dir + '"\n' + (win ? 'python' : 'python3') + ' -m http.server 8000</pre>' +
      '<p style="margin:0 0 20px;font-size:14px;line-height:1.7;color:#444">Then open <a href="http://localhost:8000/Sitemap.dc.html" style="color:#3A836B;font-weight:600">http://localhost:8000/Sitemap.dc.html</a></p>' +
      '<a href="START-HERE.html" style="display:inline-flex;align-items:center;height:48px;padding:0 22px;border-radius:8px;background:#3A836B;color:#fff;font-weight:600;font-size:15px;text-decoration:none">Full instructions</a>' +
      '</div>';
    document.body.appendChild(o);
  });
})();
</script>
</head>
<body>
<x-dc>
<helmet>
<title>Catalogue — Uloominate admin</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;family=Montserrat+Alternates:wght@500&amp;family=DM+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet" />
<style>
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;font-family:Poppins,system-ui,sans-serif;color:#121212;background:#F7F8FA;-webkit-font-smoothing:antialiased}
  a{color:#3A836B;text-decoration:none}a:hover{color:#29483C}
  :focus-visible{outline:2px solid #3A836B;outline-offset:3px;border-radius:6px}
</style>
</helmet>
<div data-screen-label="D-05 Admin Catalogue">
  <dc-import name="AdminShell" active="adminCatalogue" title="Catalogue" subtitle="{{ subtitle }}" hint-size="100%,100vh">

    <div style="display:flex;flex-direction:column;gap:18px">

      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="5">
          <button type="button" onClick="{{ t.onPick }}" aria-pressed="{{ t.pressed }}" style="display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 15px;border:1px solid {{ t.border }};border-radius:9999px;background:{{ t.bg }};font-family:Poppins,sans-serif;font-size:13px;font-weight:600;color:{{ t.ink }};cursor:pointer">
            {{ t.label }}
            <span style="min-width:20px;height:19px;padding:0 5px;border-radius:10px;background:{{ t.pillBg }};color:{{ t.pillInk }};font-family:'DM Sans',Poppins,sans-serif;font-size:11px;line-height:19px;text-align:center">{{ t.count }}</span>
          </button>
        </sc-for>
      </div>

      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
        <label style="display:flex;align-items:center;gap:8px;height:42px;padding:0 14px;border:1px solid #E7E9EE;border-radius:8px;background:#FFFFFF">
          <span style="font-size:12.5px;color:#595959">Vendor</span>
          <select value="{{ vendorId }}" onChange="{{ onVendor }}" aria-label="Filter by vendor" style="border:none;background:transparent;font-family:Poppins,sans-serif;font-size:13.5px;font-weight:500;color:#121212;outline:none;cursor:pointer;max-width:180px">
            <option value="">All vendors</option>
            <sc-for list="{{ vendorOptions }}" as="v" hint-placeholder-count="6">
              <option value="{{ v.id }}">{{ v.name }}</option>
            </sc-for>
          </select>
        </label>
        <label style="margin-left:auto;display:flex;align-items:center;gap:8px;height:42px;padding:0 14px;border:1px solid #E7E9EE;border-radius:8px;background:#FFFFFF;flex:0 1 300px;min-width:190px">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#595959" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.4-3.4"></path></svg>
          <input type="search" value="{{ query }}" onInput="{{ onSearch }}" placeholder="Search every resource" aria-label="Search the catalogue" style="flex:1;min-width:0;border:none;outline:none;background:transparent;font-family:Poppins,sans-serif;font-size:13.5px" />
        </label>
      </div>

      <sc-if value="{{ loading }}" hint-placeholder-val="{{ true }}">
        <div aria-hidden="true" style="display:flex;flex-direction:column;gap:10px">
          <span style="height:78px;border-radius:12px;background:#EEF0F4"></span>
          <span style="height:78px;border-radius:12px;background:#F1F3F6"></span>
          <span style="height:78px;border-radius:12px;background:#F3F5F8"></span>
        </div>
      </sc-if>

      <sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ false }}">
        <div data-testid="catalogue-empty" style="background:#FFFFFF;border:1px dashed #DCE7E1;border-radius:16px;padding:60px 40px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center">
          <h2 style="margin:0;font-weight:600;font-size:19px;color:#29483C">{{ emptyTitle }}</h2>
          <p style="margin:0;max-width:420px;font-size:13.5px;line-height:1.7;color:#595959">{{ emptyBody }}</p>
        </div>
      </sc-if>

      <sc-if value="{{ hasRows }}" hint-placeholder-val="{{ false }}">
        <div style="background:#FFFFFF;border:1px solid #E7E9EE;border-radius:16px;overflow:hidden">
          <sc-for list="{{ rows }}" as="p" hint-placeholder-count="8">
            <div data-testid="catalogue-row" style="display:flex;align-items:center;gap:16px;padding:15px 18px;border-bottom:1px solid #F3F5F7;flex-wrap:wrap">
              <span style="flex:0 0 78px;width:78px;height:54px;border-radius:9px;overflow:hidden;background:#F3F4F6">
                <img src="{{ p.cover }}" alt="" loading="lazy" style="display:block;width:100%;height:100%;object-fit:cover" />
              </span>

              <div style="flex:1 1 260px;min-width:0;display:flex;flex-direction:column;gap:4px">
                <span style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
                  <a href="{{ p.href }}" style="font-weight:600;font-size:14px;line-height:1.4;color:#121212" style-hover="color:#3A836B">{{ p.title }}</a>
                  <span style="padding:3px 9px;border-radius:9999px;background:{{ p.badgeBg }};color:{{ p.badgeInk }};font-size:10.5px;font-weight:700">{{ p.badgeText }}</span>
                </span>
                <span style="font-size:12px;color:#595959;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ p.vendorName }} · {{ p.meta }}</span>
              </div>

              <div style="flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:2px;min-width:84px">
                <span style="font-family:'DM Sans',Poppins,sans-serif;font-weight:700;font-size:14px;color:#29483C">{{ p.price }}</span>
                <span style="font-family:'DM Sans',Poppins,sans-serif;font-size:11px;color:#9AA5A0">{{ p.downloads }}</span>
              </div>

              <div style="flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:2px;min-width:70px">
                <span aria-hidden="true" style="font-size:12px;color:#FFC107;letter-spacing:1px">{{ p.stars }}</span>
                <span style="font-family:'DM Sans',Poppins,sans-serif;font-size:11px;color:#9AA5A0">{{ p.ratingLabel }}</span>
              </div>

              <div style="flex:0 0 auto;display:flex;gap:7px;flex-wrap:wrap">
                <sc-if value="{{ p.canUnpublish }}" hint-placeholder-val="{{ false }}">
                  <button type="button" onClick="{{ p.onUnpublish }}" data-testid="unpublish" style="height:34px;padding:0 12px;border:1px solid #E7E9EE;border-radius:8px;background:#FFFFFF;font-family:Poppins,sans-serif;font-size:12px;font-weight:600;color:#B9913E;cursor:pointer" style-hover="background:#FFF9EF">Unpublish</button>
                </sc-if>
                <sc-if value="{{ p.canApprove }}" hint-placeholder-val="{{ false }}">
                  <button type="button" onClick="{{ p.onApprove }}" style="height:34px;padding:0 12px;border:none;border-radius:8px;background:#3A836B;color:#FFFFFF;font-family:Poppins,sans-serif;font-size:12px;font-weight:600;cursor:pointer" style-hover="background:#29483C">Publish</button>
                </sc-if>
                <button type="button" onClick="{{ p.onDelete }}" aria-label="{{ p.deleteLabel }}" style="width:34px;height:34px;border:1px solid #E7E9EE;border-radius:8px;background:#FFFFFF;color:#C0392B;display:grid;place-items:center;cursor:pointer" style-hover="background:#FDF1EF;border-color:#F3D6D2">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 7h14M10 7V5h4v2M7 7l1 13h8l1-13"></path></svg>
                </button>
              </div>
            </div>
          </sc-for>
        </div>

        <sc-if value="{{ showPager }}" hint-placeholder-val="{{ false }}">
          <nav aria-label="Pagination" style="display:flex;justify-content:center;gap:8px">
            <button type="button" onClick="{{ onPrev }}" disabled="{{ prevDisabled }}" aria-label="Previous page" style="width:40px;height:40px;border:1px solid #E7E9EE;border-radius:8px;background:#FFFFFF;display:grid;place-items:center;cursor:pointer;opacity:{{ prevOpacity }};color:#2B2B2B" style-hover="border-color:#3A836B">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
            </button>
            <span style="display:inline-flex;align-items:center;padding:0 14px;font-family:'DM Sans',Poppins,sans-serif;font-size:13.5px;color:#595959">{{ pageLabel }}</span>
            <button type="button" onClick="{{ onNext }}" disabled="{{ nextDisabled }}" aria-label="Next page" style="width:40px;height:40px;border:1px solid #E7E9EE;border-radius:8px;background:#FFFFFF;display:grid;place-items:center;cursor:pointer;opacity:{{ nextOpacity }};color:#2B2B2B" style-hover="border-color:#3A836B">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
            </button>
          </nav>
        </sc-if>
      </sc-if>
    </div>

  </dc-import>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
const BADGES = {
  approved: { bg: '#EAF7F1', ink: '#3A836B', label: 'LIVE' },
  pending: { bg: '#FFF2DE', ink: '#B9913E', label: 'IN REVIEW' },
  draft: { bg: '#E3F7FD', ink: '#2F7FA0', label: 'DRAFT' },
  declined: { bg: '#FDF1EF', ink: '#C0392B', label: 'DECLINED' },
  unpublished: { bg: '#F3F4F6', ink: '#595959', label: 'UNPUBLISHED' },
};

class Component extends DCLogic {
  state = { loading: true, rows: [], meta: null, counts: {}, vendors: [], user: null, status: '', vendorId: '', query: '', page: 1 };

  async componentDidMount() {
    const [app, products, vendorsRepo, db] = await Promise.all([
      import('./assets/js/app.js'),
      import('./assets/js/repositories/productsRepo.js'),
      import('./assets/js/repositories/vendorsRepo.js'),
      import('./assets/js/db.js'),
    ]);
    await app.boot();
    Object.assign(this, { app, products, vendorsRepo, db });
    const user = app.auth.requireRole('admin');
    if (!user) return;
    const vs = await vendorsRepo.listVendors({ pageSize: 60 });
    this.setState({
      user,
      vendors: vs.data,
      vendorId: app.router.param('vendor', '') || '',
    });
    await this.load();
  }

  async load() {
    const res = await this.products.listProducts({
      status: this.state.status || 'any',
      vendorId: this.state.vendorId || undefined,
      q: this.state.query,
      page: this.state.page, pageSize: 15,
      sort: 'newest',
    });
    const all = this.db.findAll('products').rows;
    this.setState({
      loading: false, rows: res.data, meta: res.meta,
      counts: {
        all: all.length,
        approved: all.filter(p => p.status === 'approved').length,
        pending: all.filter(p => p.status === 'pending').length,
        declined: all.filter(p => p.status === 'declined').length,
        unpublished: all.filter(p => p.status === 'unpublished').length,
      },
    });
  }

  set(patch) { this.setState(patch, () => this.load()); }

  stars(n) {
    const f = Math.round(Number(n) || 0);
    return '★'.repeat(f) + '☆'.repeat(Math.max(0, 5 - f));
  }

  renderVals() {
    const url = this.app ? this.app.router.url : (() => '#');
    const { loading, rows, meta, counts, vendors, status, vendorId, query, page } = this.state;
    const pages = meta ? meta.totalPages : 1;

    return {
      subtitle: counts.all ? counts.all + ' resources across every vendor · ' + counts.approved + ' live' : '',
      loading, query, vendorId,
      vendorOptions: vendors.map(v => ({ id: v.id, name: v.storeName })),

      tabs: [
        { key: '', label: 'All', n: counts.all },
        { key: 'approved', label: 'Live', n: counts.approved },
        { key: 'pending', label: 'In review', n: counts.pending },
        { key: 'declined', label: 'Declined', n: counts.declined },
        { key: 'unpublished', label: 'Unpublished', n: counts.unpublished },
      ].map(t => {
        const on = t.key === status;
        return {
          label: t.label,
          count: String(t.n || 0),
          pressed: on ? 'true' : 'false',
          bg: on ? '#3A836B' : '#FFFFFF',
          border: on ? '#3A836B' : '#E7E9EE',
          ink: on ? '#FFFFFF' : '#29483C',
          pillBg: on ? 'rgba(255,255,255,.22)' : '#F1F3F6',
          pillInk: on ? '#FFFFFF' : '#595959',
          onPick: () => this.set({ status: t.key, page: 1 }),
        };
      }),

      isEmpty: !loading && rows.length === 0,
      hasRows: !loading && rows.length > 0,
      emptyTitle: query || status || vendorId ? 'Nothing matches that view' : 'The catalogue is empty',
      emptyBody: query || status || vendorId
        ? 'Try clearing the search, the vendor filter, or the status.'
        : 'Resources appear here once vendors submit them.',

      rows: rows.map(p => {
        const b = BADGES[p.status] || BADGES.draft;
        return {
          title: p.title.length > 60 ? p.title.slice(0, 58).trim() + '…' : p.title,
          cover: p.cover,
          href: url('product', { id: p.id }),
          vendorName: p.vendorName,
          meta: [p.categoryName, p.gradeLabel].filter(Boolean).join(' · '),
          badgeText: b.label, badgeBg: b.bg, badgeInk: b.ink,
          price: p.price ? '$' + p.price.toFixed(2) : 'Free',
          downloads: (p.downloads || 0).toLocaleString('en-US') + ' dl',
          stars: this.stars(p.ratingAvg),
          ratingLabel: p.ratingCount ? '(' + p.ratingCount + ')' : '(new)',
          canUnpublish: p.status === 'approved',
          canApprove: p.status === 'pending' || p.status === 'unpublished',
          deleteLabel: 'Delete ' + p.title,

          onUnpublish: async () => {
            const ok = await this.app.confirmDialog({
              title: 'Unpublish this resource?',
              body: '"' + p.title + '" will be removed from the storefront. Existing purchasers keep their download access.',
              confirmLabel: 'Unpublish',
            });
            if (!ok) return;
            await this.products.unpublishProduct(p.id);
            await this.load();
            this.app.toast('Product unpublished. It is no longer visible on the storefront.', 'info');
          },
          onApprove: async () => {
            await this.products.approveProduct(p.id, (this.user || this.state.user).id);
            await this.load();
            this.app.toast('Product approved and published to the storefront.', 'success');
          },
          onDelete: async () => {
            const ok = await this.app.confirmDialog({
              title: 'Delete this resource?',
              body: '"' + p.title + '" is removed permanently. Purchasers keep their download access.',
              confirmLabel: 'Delete resource',
            });
            if (!ok) return;
            await this.products.deleteProduct(p.id);
            await this.load();
            this.app.toast('Product deleted.', 'success');
          },
        };
      }),

      showPager: !loading && pages > 1,
      pageLabel: 'Page ' + page + ' of ' + pages,
      prevDisabled: page <= 1, nextDisabled: page >= pages,
      prevOpacity: page <= 1 ? 0.4 : 1, nextOpacity: page >= pages ? 0.4 : 1,
      onPrev: () => { if (page > 1) this.set({ page: page - 1 }); },
      onNext: () => { if (page < pages) this.set({ page: page + 1 }); },
      onVendor: e => this.set({ vendorId: e.target.value, page: 1 }),
      onSearch: e => {
        const v = e.target.value;
        clearTimeout(this._t);
        this.setState({ query: v, page: 1 });
        this._t = setTimeout(() => this.load(), 240);
      },
    };
  }
}

</script>
</body>
</html>
