<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
<script>
(function () {
  if (location.protocol !== 'file:') return;
  var here = decodeURIComponent(location.pathname.replace(/\/[^\/]*$/, ''));
  var win = /^\/[A-Za-z]:/.test(here);
  var dir = win ? here.slice(1).replace(/\//g, '\\') : here;
  document.addEventListener('DOMContentLoaded', function () {
    var o = document.createElement('div');
    o.setAttribute('data-file-protocol-guard', '');
    o.style.cssText = 'position:fixed;inset:0;z-index:2147483647;background:#F2FAF7;overflow:auto;font-family:Poppins,system-ui,sans-serif;color:#121212;padding:40px 24px';
    o.innerHTML =
      '<div style="max-width:680px;margin:0 auto;background:#fff;border:1px solid #E6EFEA;border-radius:16px;padding:32px;box-shadow:0 1px 2px rgba(18,18,18,.04),0 24px 48px -32px rgba(41,72,60,.4)">' +
      '<h1 style="margin:0 0 12px;font-weight:600;font-size:26px;line-height:1.2;color:#29483C">One step before this page works</h1>' +
      '<p style="margin:0 0 18px;font-size:15px;line-height:1.75;color:#444">You opened this file straight from disk. Browsers block a local file from loading its data and shared components, so the page renders its layout and then stops at <em>Loading…</em>. Nothing is broken \u2014 it just has to be served over <code>http://</code>.</p>' +
      '<div style="background:#EAF7F1;border-left:4px solid #3A836B;border-radius:10px;padding:16px 18px;margin:0 0 18px">' +
      '<p style="margin:0 0 10px;font-weight:600;font-size:14.5px;color:#29483C">Quickest fix \u2014 no server at all</p>' +
      '<p style="margin:0 0 13px;font-size:14px;line-height:1.7;color:#444">Open <code>standalone.html</code> in this same folder. It is the whole prototype in one self-contained file, so it runs straight from disk. Screens that take an id in the address \u2014 product detail, vendor storefront \u2014 need the served copy below.</p>' +
      '<a href="standalone.html" style="display:inline-flex;align-items:center;height:44px;padding:0 20px;border-radius:8px;background:#3A836B;color:#fff;font-weight:600;font-size:14px;text-decoration:none">Open standalone.html</a></div>' +
      '<div style="background:#F5F8F7;border-left:4px solid #DCE7E1;border-radius:10px;padding:16px 18px;margin:0 0 18px">' +
      '<p style="margin:0 0 10px;font-weight:600;font-size:14.5px;color:#29483C">Or serve the folder</p>' +
      '<p style="margin:0;font-size:14px;line-height:1.7;color:#444">In the prototype folder, <strong>right-click</strong> ' +
      (win ? '<code>start-windows.bat</code> and choose <strong>Run</strong>' : '<code>start-mac-linux.command</code> and choose <strong>Open</strong>, then confirm') +
      '. macOS blocks these on a plain double-click the first time \u2014 right-click and Open gets past it.</p></div>' +
      '<p style="margin:0 0 8px;font-weight:600;font-size:14.5px;color:#29483C">Or do it by hand</p>' +
      '<pre style="margin:0 0 18px;background:#122A22;color:#E8F2ED;border-radius:10px;padding:16px 18px;overflow-x:auto;font-size:13.5px;line-height:1.6;font-family:ui-monospace,monospace">cd "' + dir + '"\n' + (win ? 'python' : 'python3') + ' -m http.server 8000</pre>' +
      '<p style="margin:0 0 20px;font-size:14px;line-height:1.7;color:#444">Then open <a href="http://localhost:8000/Sitemap.dc.html" style="color:#3A836B;font-weight:600">http://localhost:8000/Sitemap.dc.html</a></p>' +
      '<a href="START-HERE.html" style="display:inline-flex;align-items:center;height:48px;padding:0 22px;border-radius:8px;background:#3A836B;color:#fff;font-weight:600;font-size:15px;text-decoration:none">Full instructions</a>' +
      '</div>';
    document.body.appendChild(o);
  });
})();
</script>
</head>
<body>
<x-dc>
<footer data-region="site-footer" style="background:#FEFFFF;border-top:1px solid #EDF3F0;width:100%">
  <div style="max-width:1728px;margin:0 auto;padding:64px 48px 40px;display:flex;flex-direction:column;gap:40px">

    <div style="display:flex;align-items:flex-start;gap:48px;flex-wrap:wrap">
      <div style="display:flex;flex-direction:column;align-items:center;gap:0;flex:0 0 auto;min-width:208px">
        <img src="assets/img/logo-mark.png" alt="" width="40" height="49" style="display:block;object-fit:contain" />
        <span style="font-family:'Montserrat Alternates',Poppins,sans-serif;font-weight:500;font-size:30px;line-height:37px;color:#3A836B;text-align:center">Uloominate</span>
        <span style="font-family:'Playfair Display',serif;font-weight:400;font-size:12px;line-height:16px;color:#3A836B;text-align:center">Teach More. Share More. </span>
      </div>

      <nav aria-label="Company" style="display:flex;flex-direction:column;gap:12px;flex:0 0 auto;margin-left:clamp(0px,4.7vw,82px)">
        <sc-for list="{{ links }}" as="link" hint-placeholder-count="4">
          <a href="{{ link.href }}" style="font-weight:400;font-size:14px;line-height:21px;color:#29483C;transition:color .16s ease" style-hover="color:#3A836B">{{ link.label }}</a>
        </sc-for>
      </nav>

      <div style="display:flex;flex-direction:column;gap:12px;flex:0 0 auto;margin-left:auto">
        <span style="font-family:'DM Sans',Poppins,sans-serif;font-weight:700;font-size:13px;line-height:17px;color:#121212">Keep in Touch</span>
        <div style="display:flex;gap:12px">
          <a href="{{ socialHref }}" aria-label="Instagram" style="width:36px;height:36px;border-radius:18px;background:#F3F4F6;display:grid;place-items:center;color:#29483C;transition:background .16s ease,transform .16s ease" style-hover="background:#EAF7F1;transform:translateY(-2px);color:#3A836B">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.2" cy="6.8" r="1.1" fill="currentColor" stroke="none"></circle></svg>
          </a>
          <a href="{{ socialHref }}" aria-label="Facebook" style="width:36px;height:36px;border-radius:18px;background:#F3F4F6;display:grid;place-items:center;color:#29483C;transition:background .16s ease,transform .16s ease" style-hover="background:#EAF7F1;transform:translateY(-2px);color:#3A836B">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M14.4 21v-8h2.7l.4-3.1h-3.1V7.9c0-.9.25-1.5 1.55-1.5H17.6V3.6c-.3 0-1.3-.13-2.45-.13-2.43 0-4.1 1.48-4.1 4.2v2.34H8.35V13h2.7v8h3.35Z"></path></svg>
          </a>
          <a href="{{ socialHref }}" aria-label="Threads" style="width:36px;height:36px;border-radius:18px;background:#F3F4F6;display:grid;place-items:center;color:#29483C;transition:background .16s ease,transform .16s ease" style-hover="background:#EAF7F1;transform:translateY(-2px);color:#3A836B">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="m9.2 9.2 5.6 5.6M14.8 9.2l-5.6 5.6"></path></svg>
          </a>
          <a href="{{ socialHref }}" aria-label="X" style="width:36px;height:36px;border-radius:18px;background:#F3F4F6;display:grid;place-items:center;color:#29483C;transition:background .16s ease,transform .16s ease" style-hover="background:#EAF7F1;transform:translateY(-2px);color:#3A836B">
            <svg width="18" height="15" viewBox="0 0 24 20" fill="currentColor" aria-hidden="true"><path d="M18.2 0h3.5l-7.6 8.7L23 20h-7l-5.5-7.2L4.2 20H.7l8.1-9.3L.4 0h7.2l5 6.6L18.2 0Zm-1.2 17.9h1.9L7.1 2H5l11.9 15.9Z"></path></svg>
          </a>
        </div>
      </div>
    </div>

    <div style="height:1px;background:#E6EFEA;width:100%"></div>

    <div style="display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap">
      <span style="font-weight:400;font-size:16px;line-height:25px;color:#29483C">Copyright © 2025 Uloominate</span>
      <div style="display:flex;gap:16px;align-items:center">
        <a href="{{ privacyHref }}" style="font-size:13px;line-height:16px;color:#595959" style-hover="color:#3A836B">Privacy</a>
        <a href="{{ termsHref }}" style="font-size:13px;line-height:16px;color:#595959" style-hover="color:#3A836B">Terms</a>
        <a href="{{ sitemapHref }}" style="font-size:13px;line-height:16px;color:#595959" style-hover="color:#3A836B">Sitemap</a>
      </div>
    </div>
  </div>
</footer>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1728,&quot;height&quot;:330},&quot;socialHref&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;#&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { r: null };
  async componentDidMount() {
    const router = await import('./assets/js/router.js');
    this.setState({ r: router });
  }
  renderVals() {
    const u = this.state.r ? this.state.r.url : (x => x);
    return {
      links: [
        { label: 'About Us', href: u('about') },
        { label: 'Privacy Policy', href: u('privacy') },
        { label: 'Terms & Conditions', href: u('terms') },
        { label: 'Contact Us', href: u('contact') },
      ],
      privacyHref: u('privacy'),
      termsHref: u('terms'),
      sitemapHref: u('sitemap'),
      // TODO(client): CD-2 — replace with the real handles once supplied.
      // Never ships as href="#": until then every icon routes to Contact Us.
      socialHref: this.props.socialHref || u('contact'),
    };
  }
}

</script>
</body>
</html>
